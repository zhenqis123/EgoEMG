<text x="52" y="79" fill="#52636b" font-size="21">Synchronized muscle activity, vision and hand pose.</text>
<text x="1408" y="51" text-anchor="end" fill="#52636b" font-size="17">BILATERAL · EGOCENTRIC</text>

