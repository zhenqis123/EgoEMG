<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
<title id="title">EgoEMG dataset at a glance</title>
<desc id="description">68 participants, 25.9 hours in 81 recording sessions, 60 gesture classes, 10 object categories, 8 EMG channels per wrist, and 22 finger and wrist angles per hand. Synchronized EMG, IMU, RGB and RGB-D vision, and motion capture.</desc>
