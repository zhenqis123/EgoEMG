# @package _global_
# No-augmentation transforms for EMG regression.
# Only ExtractField + ToFloatTensor (no rotation, channel/time/freq masking, or noise).
to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg

transforms:
  train:
  - _target_: emg2pose.transforms.ExtractField
    field: emg
  - _target_: emg2pose.transforms.ToFloatTensor
  val:
  - ${to_tensor}
  test: ${transforms.val}
