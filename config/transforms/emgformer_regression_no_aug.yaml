# @package _global_
# No augmentation — just extract EMG and convert to tensor.
to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg

transforms:
  train:
  - _target_: emg2pose.transforms.ExtractField
    field: emg
  - _target_: emg2pose.transforms.ToFloatTensor
  val:
  - ${to_tensor}
  test: ${transforms.val}
