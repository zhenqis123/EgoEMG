# @package _global_
transforms:
  train:
    - _target_: emg2pose.transforms.ExtractStructuredFields
    - _target_: emg2pose.transforms.LocalTimeWarp
      min_num_knots: 5
      max_num_knots: 8
      max_jitter_ratio: 0.2
      mask_prob: 0.5
      time_dim: 0
    - _target_: emg2pose.transforms.RotationAugmentation
      channel_dim: -1
    - _target_: emg2pose.transforms.RandomGain
      min_gain: 0.7
      max_gain: 1.4
      mask_prob: 0.5
      per_channel: true
      channel_dim: -1
    - _target_: emg2pose.transforms.ToFloatTensor
    - _target_: emg2pose.transforms.RandomChannelMask
      mask_prob: 0.5
      min_masked: 0
      max_masked: null
      channel_dim: -1
      mask_value: 0.0
    - _target_: emg2pose.transforms.ToSpectrogram
      n_fft: 256
      hop_length: 64
      win_length: null
      window: hann
      center: true
      onesided: true
      time_dim: 0
      channel_dim: -1
    - _target_: emg2pose.transforms.RandomSpectrogramBandTimeMask
      sample_rate: 2000.0
      n_fft: 256
      bands_hz:
        - [31.25, 62.5]
        - [62.5, 125]
        - [125, 250]
        - [250, 375]
        - [375, 687.5]
        - [687.5, 1000]
      band_weights: null
      mask_prob: 0.5
      num_masks: 6
      max_time_mask_size: 60
      min_time_mask_size: 0
      per_channel: true
      mask_value: 0.0
    - _target_: emg2pose.transforms.FromSpectrogram
      n_fft: 256
      hop_length: 64
      win_length: null
      window: hann
      center: true
      onesided: true
      time_dim: 0
      channel_dim: -1
  val:
    - _target_: emg2pose.transforms.ExtractField
      field: "emg"
    - _target_: emg2pose.transforms.ToFloatTensor
  test: ${transforms.val}
