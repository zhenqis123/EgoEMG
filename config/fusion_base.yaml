# @package _global_
# Base config for EMG + Vision fusion training.
# Experiment configs (config/experiment/fusion/) inherit from this
# and override freeze strategy, LR, etc.
defaults:
  - /module: mid_fusion
  - /dataset: egoemg_angle_regression
  - _self_

# ── EMG data ────────────────────────────────────────────────────────────────
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

# ── Vision data ─────────────────────────────────────────────────────────────
video_root: /home/xiziheng/develop/emg2pose/data/EgoEMG
allintra_root: /home/xiziheng/develop/emg2pose/data/EgoEMG_allintra
vision_num_frames: 1
vision_frame_stride: 1
vision_frame_selection: center
vision_patch_size: 256

# ── WiLoR ───────────────────────────────────────────────────────────────────
wilor_checkpoint_path: /home/xiziheng/develop/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/develop/WiLoR/mano_data

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
checkpoint: null
max_epochs: 100
batch_size: 64
val_batch_size: 64
num_workers: 8
prefetch_factor: 1
persistent_workers: true
devices: [0]
strategy: auto
precision: bf16-mixed
gradient_clip_val: 1.0
matmul_precision: medium

optimizer:
  lr: 5.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 1560
  val_test_stride: 7_790
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false

# ── Module overrides ────────────────────────────────────────────────────────
module:
  out_channels: 22
  provide_initial_pos: false
  vision_embed_dim: 1280
  emg_feat_dim: 256
  fusion_proj_dim: 256
  vision_pretrained_checkpoint: ${wilor_checkpoint_path}
  mano_model_path: ${mano_model_path}
  vision_freeze: ${vision_freeze}
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
  head:
    in_channels: 256
    out_channels: 22
