# @package _global_
# GPU batch-level augmentation — BEST V2 config (aug-v2 sweep trial #12).
# val_mae = 0.2446 (improvement of -0.0035 / -1.4% over trial 54 baseline 0.2481).
#
# Key changes vs trial 54 baseline:
#   NEW: MixUp (freq-domain, prob=0.20, alpha=0.29) — inter-sample blending
#   UP:  baseline_drift amplitude 0.13 → 0.15
#   UP:  freq_mask count 14 → 18
#   OFF: time_mask (was 2×243, now 0)
#   OFF: channel_rotation (confirmed harmful for 8ch target_hand layout)
#   ON:  per-channel time_mask switch (irrelevant since num_masks=0)
#
# Base (fixed from trial 54): random_gain, mag_warping, powerline, channel_mask,
# gaussian_noise params are identical to the v3 decoupled sweep best trial.
batch_augmentation:
  random_gain:
    min_gain: 0.1996
    max_gain: 0.9486
    mask_prob: 0.0295
  mag_warping:
    sigma: 0.7302
    num_knots: 15
    mask_prob: 0.0049
  baseline_drift:
    mask_prob: 0.6547
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0
    max_amp_ratio: 0.1534
  powerline_noise:
    mask_prob: 0.2413
    min_amp_ratio: 0.0
    max_amp_ratio: 0.0628
    max_harmonic: 7
  channel_mask:
    mask_prob: 0.0016
  time_mask:
    num_masks: 0
    max_mask_size: 243
    per_channel: true
  freq_mask:
    num_masks: 18
    max_mask_size: 46
  gaussian_noise:
    min_snr_db: 45.9044
    max_snr_db: 50.0
    apply_prob: 0.1126
  # ── V2 new augmentations ────────────────────────────────────────
  channel_rotation:
    mask_prob: 0.0              # confirmed harmful for 8ch layout
    max_shift: 2
  mixup:
    mask_prob: 0.2006           # ~20% of samples get freq-domain MixUp
    alpha: 0.2921               # Beta(0.29, 0.29) mixing coefficient
