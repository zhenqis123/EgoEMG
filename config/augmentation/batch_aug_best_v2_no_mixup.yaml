  random_gain:
    min_gain: 0.1996
    max_gain: 0.9486
    mask_prob: 0.0295
  mag_warping:
    sigma: 0.7302
    num_knots: 15
    mask_prob: 0.0049
  baseline_drift:
    mask_prob: 0.6547
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0
    max_amp_ratio: 0.1534
  powerline_noise:
    mask_prob: 0.2413
    min_amp_ratio: 0.0
    max_amp_ratio: 0.0628
    max_harmonic: 7
  channel_mask:
    mask_prob: 0.0016
  time_mask:
    num_masks: 0
    max_mask_size: 243
    per_channel: true
  freq_mask:
    num_masks: 18
    max_mask_size: 46
  gaussian_noise:
    min_snr_db: 45.9044
    max_snr_db: 50.0
    apply_prob: 0.1126
  channel_rotation:
