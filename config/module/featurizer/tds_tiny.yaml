_target_: egoemg.models.featurizers.tds.TdsNetwork

se:
  enable: true
  reduction: 4
  residual: true
  mode: global

conv_blocks:
  - _target_: egoemg.models.featurizers.tds.Conv1dBlock
    in_channels: 8
    out_channels: 256
    kernel_size: 11
    stride: 5
  - _target_: egoemg.models.featurizers.tds.Conv1dBlock
    in_channels: 256
    out_channels: 256
    kernel_size: 5
    stride: 2

tds_stages:
  - _target_: egoemg.models.featurizers.tds.TdsStage
    in_channels: 256
    in_conv_kernel_width: 9
    in_conv_stride: 5
    num_blocks: 1
    # Internal: channels * feature_width = 4 * 16 = 64
    channels: 4
    feature_width: 16
    kernel_width: 5
    # Project back to 256 for decoder compatibility
    out_channels: 256