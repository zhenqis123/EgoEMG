_target_: egoemg.models.featurizers.tds.TdsNetwork

se:
  enable: true
  reduction: 4
  residual: true
  mode: global

# The pretraining corpus (emg2pose_v3 / emg2qwerty / Ninapro-relabeled) is
# harmonized to 16 EMG channels by the datasets, so the first conv must
# accept 16. (tds_slim stays 8ch for the unified EgoEMG 8ch layout.)
conv_blocks:
  - _target_: egoemg.models.featurizers.tds.Conv1dBlock
    in_channels: 16
    out_channels: 256
    kernel_size: 11
    stride: 5
  - _target_: egoemg.models.featurizers.tds.Conv1dBlock
    in_channels: 256
    out_channels: 256
    kernel_size: 5
    stride: 2

tds_stages:
  - _target_: egoemg.models.featurizers.tds.TdsStage
    in_channels: 256
    in_conv_kernel_width: 17
    in_conv_stride: 4
    num_blocks: 2
    # Total channel depth is channels * feature_width
    channels: 16
    feature_width: 16
    kernel_width: 9
  - _target_: egoemg.models.featurizers.tds.TdsStage
    in_channels: 256
    in_conv_kernel_width: 9
    in_conv_stride: 2
    num_blocks: 2
    # Total channel depth is channels * feature_width
    channels: 16
    feature_width: 16
    kernel_width: 5
