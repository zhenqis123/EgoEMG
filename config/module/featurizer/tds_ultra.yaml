# Mehlman-style ultra-lightweight featurizer: pure conv, 20x downsample
# ~60K params (equivalent to Mehlman's 82K for 32ch → scaled for our 16ch input)
# 2000Hz → 100Hz, outputs 64-dim tokens
_target_: emg2pose.models.featurizers.tds.TdsNetwork

conv_blocks:
  - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
    in_channels: 8
    out_channels: 128
    kernel_size: 11
    stride: 5
    norm_type: none
  - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
    in_channels: 128
    out_channels: 64
    kernel_size: 3
    stride: 2
    norm_type: none
  - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
    in_channels: 64
    out_channels: 64
    kernel_size: 3
    stride: 2
    norm_type: none

tds_stages: []
