defaults:
  - featurizer: sensingdynamics
  - decoder: mlp
  - _self_

_target_: emg2pose.models.modules.sensingdynamics.SensingDynamicsModule

out_channels: 20
provide_initial_pos: true  # velocity prediction needs real starting position

decoder:
  in_channels: 256  # must match featurizer out_channels
  layer_sizes: [512, 512]  # 3-layer MLP (input → 512 → 512 → output)
  layer_norm: true
  scale: 0.01
