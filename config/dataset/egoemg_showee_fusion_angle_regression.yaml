# @package _global_
# Fusion training on EgoEMG + ShowEE. EgoEMG_incre is intentionally excluded
# because it has no matched vision stream. Validation/test remain EgoEMG-only.
dataset:
  train:
    - &egoemg_train
      _target_: egoemg.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered_paper
      emg_layout: target_hand
      emg2pose_channel_indices: null
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
      jitter: true
      video_root: ${egoemg_video_root}
      allintra_root: ${egoemg_allintra_root}
      vision_patch_size: ${vision_patch_size}
      vision_num_frames: ${vision_num_frames}
      vision_frame_selection: ${vision_frame_selection}
      per_episode_crops_dir: ${egoemg_per_episode_crops_dir}
      skip_emg_loading: false
      center_target_only: true
    - <<: *egoemg_train
      target_hand: right
    - &showee_train
      <<: *egoemg_train
      memmap_dir: ${showee_memmap_dir}
      allowed_splits: [all]
      target_hand: left
      dataset_name: showee
      video_root: ${showee_video_root}
      allintra_root: ${showee_allintra_root}
      per_episode_crops_dir: ${showee_per_episode_crops_dir}
    - <<: *showee_train
      target_hand: right

  val:
    - &egoemg_val
      <<: *egoemg_train
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      eval_center_stride: ${oc.select:datamodule.eval_center_stride,null}
      allowed_splits: [user, gesture, both]
      jitter: false
    - <<: *egoemg_val
      target_hand: right

  test:
    - <<: *egoemg_val
    - <<: *egoemg_val
      target_hand: right
