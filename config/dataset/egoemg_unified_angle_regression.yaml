# @package _global_
# Dataset config for the physically-merged EgoEMG + ShowEE + Incre memmap.
#
# A single EgoEmgMemmapDataset reads the unified memmap produced by
# scripts/data/merge_datasets_to_unified_memmap.py. Per-sample provenance is
# restored from the `dataset_source_id` field, so lightning.py's dataset_name-
# keyed wrist-mask still applies (ShowEE/Incre wrist = unsupervised; EgoEMG
# wrist = supervised).  Incre rows have vision/mocap marked unavailable at the
# memmap level (stale=True, valid=False).
#
# train: EgoEMG + ShowEE + Incre (all their train-split rows)
# val/test: EgoEMG-only (ShowEE/Incre rows were forced to frame_split_id=0
#           during the merge, so the [user, gesture, both] filters naturally
#           exclude them — preserving the EgoEMG evaluation baseline).
#
# Set egoemg_unified_memmap_dir + per_dataset_norm_stats_path in the experiment.
dataset:
  train:
    - _target_: egoemg.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_unified_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: ${oc.select:egoemg_emg_field_preference,filtered_paper}
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      # Instance dataset_name is the fallback; per-sample name comes from
      # dataset_source_id. Use the unified norm-stats key.
      dataset_name: egoemg_unified
      jitter: true
      mano_npy_dir: ${oc.select:egoemg_mano_npy_dir,null}
      video_root: ${oc.select:video_root,null}
      allintra_root: ${oc.select:allintra_root,null}
      vision_patch_size: ${oc.select:vision_patch_size,256}
      vision_num_frames: ${oc.select:vision_num_frames,0}
      vision_frame_stride: ${oc.select:vision_frame_stride,1}
      vision_frame_selection: ${oc.select:vision_frame_selection,center}
      per_episode_crops_dir: ${oc.select:per_episode_crops_dir,null}
      cached_vit_features_dir: ${oc.select:cached_vit_features_dir,null}
      preload_features: ${oc.select:preload_features,false}
      skip_emg_loading: ${oc.select:skip_emg_loading,false}
      center_target_only: ${oc.select:center_target_only,false}
      skip_fields: ${oc.select:egoemg_skip_fields,null}

    - _target_: egoemg.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_unified_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      emg_field_preference: ${oc.select:egoemg_emg_field_preference,filtered_paper}
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg_unified
      jitter: true
      mano_npy_dir: ${oc.select:egoemg_mano_npy_dir,null}
      video_root: ${oc.select:video_root,null}
      allintra_root: ${oc.select:allintra_root,null}
      vision_patch_size: ${oc.select:vision_patch_size,256}
      vision_num_frames: ${oc.select:vision_num_frames,0}
      vision_frame_stride: ${oc.select:vision_frame_stride,1}
      vision_frame_selection: ${oc.select:vision_frame_selection,center}
      per_episode_crops_dir: ${oc.select:per_episode_crops_dir,null}
      cached_vit_features_dir: ${oc.select:cached_vit_features_dir,null}
      preload_features: ${oc.select:preload_features,false}
      skip_emg_loading: ${oc.select:skip_emg_loading,false}
      center_target_only: ${oc.select:center_target_only,false}
      skip_fields: ${oc.select:egoemg_skip_fields,null}

  val:
    - _target_: egoemg.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_unified_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      eval_center_stride: ${oc.select:datamodule.eval_center_stride,null}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: ${oc.select:egoemg_emg_field_preference,filtered_paper}
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg_unified
      jitter: false
      mano_npy_dir: ${oc.select:egoemg_mano_npy_dir,null}
      video_root: ${oc.select:video_root,null}
      allintra_root: ${oc.select:allintra_root,null}
      vision_patch_size: ${oc.select:vision_patch_size,256}
      vision_num_frames: ${oc.select:vision_num_frames,0}
      vision_frame_stride: ${oc.select:vision_frame_stride,1}
      vision_frame_selection: ${oc.select:vision_frame_selection,center}
      per_episode_crops_dir: ${oc.select:per_episode_crops_dir,null}
      cached_vit_features_dir: ${oc.select:cached_vit_features_dir,null}
      preload_features: ${oc.select:preload_features,false}
      skip_emg_loading: ${oc.select:skip_emg_loading,false}
      center_target_only: ${oc.select:center_target_only,true}
      skip_fields: ${oc.select:egoemg_skip_fields,null}

    - _target_: egoemg.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_unified_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      eval_center_stride: ${oc.select:datamodule.eval_center_stride,null}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      emg_field_preference: ${oc.select:egoemg_emg_field_preference,filtered_paper}
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg_unified
      jitter: false
      mano_npy_dir: ${oc.select:egoemg_mano_npy_dir,null}
      video_root: ${oc.select:video_root,null}
      allintra_root: ${oc.select:allintra_root,null}
      vision_patch_size: ${oc.select:vision_patch_size,256}
      vision_num_frames: ${oc.select:vision_num_frames,0}
      vision_frame_stride: ${oc.select:vision_frame_stride,1}
      vision_frame_selection: ${oc.select:vision_frame_selection,center}
      per_episode_crops_dir: ${oc.select:per_episode_crops_dir,null}
      cached_vit_features_dir: ${oc.select:cached_vit_features_dir,null}
      preload_features: ${oc.select:preload_features,false}
      skip_emg_loading: ${oc.select:skip_emg_loading,false}
      center_target_only: ${oc.select:center_target_only,true}
      skip_fields: ${oc.select:egoemg_skip_fields,null}

  test: ${dataset.val}
