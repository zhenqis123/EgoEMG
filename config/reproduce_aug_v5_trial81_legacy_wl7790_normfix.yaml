    max_gain: 0.6739
    mask_prob: 0.1422
  mag_warping:
    sigma: 0.177
    num_knots: 15
    mask_prob: 0.0253
  baseline_drift:
    mask_prob: 0.3544
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0154
    max_amp_ratio: 0.0572
  powerline_noise:
    mask_prob: 0.08
    min_amp_ratio: 0.0141
    max_amp_ratio: 0.0628
    max_harmonic: 5
  channel_mask:
    mask_prob: 0.0112
  time_mask:
    num_masks: 6
    max_mask_size: 500
  freq_mask:
    num_masks: 4
    max_mask_size: 128
  gaussian_noise:
    min_snr_db: 44.0937
    max_snr_db: 50.0
    apply_prob: 0.7761
monitor_metric: val_mae
monitor_mode: min
loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
trainer:
  max_epochs: 150
