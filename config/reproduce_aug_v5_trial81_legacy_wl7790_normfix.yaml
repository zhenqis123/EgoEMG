data_location: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
seed: 81
matmul_precision: high
default_model_summary: true
model_summary_max_depth: 2
batch_size: 500
num_workers: 12
train: true
eval: true
checkpoint: null
pretrained_checkpoint: null
pretrained_strict: false
freeze_backbone: false
stage2_vision_checkpoint: null
component_lr_scales: {}
ignore_head_tail_dims: 0
batch_augmentation:
