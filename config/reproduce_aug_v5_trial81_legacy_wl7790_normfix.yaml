datamodule:
  _target_: egoemg.datamodule.WindowedEmgDataModule
  dataset_conf: ${dataset}
  window_length: 7790
  val_test_window_length: 7790
  stride: 780
  val_test_stride: 7790
  padding:
  - 0
  - 0
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  skip_ik_failures: false
  max_open_files: 32
  norm_mode: per-dataset
  norm_stats_path: null
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats_repro_filtered_paper_alias.json
  norm_eps: 1.0e-06
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
lr_scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.max_epochs}
    eta_min: 5.0e-06
  interval: epoch
  frequency: 1
data_split:
  _target_: egoemg.utils.load_splits
  metadata_file: ${data_location}/metadata.csv
  subsample: 1
to_tensor:
  _target_: egoemg.transforms.ExtractToTensor
  field: emg
transforms:
  train:
  - _target_: egoemg.transforms.ExtractField
    field: emg
  - _target_: egoemg.transforms.RotationAugmentation
    channel_dim: -1
  - _target_: egoemg.transforms.ToFloatTensor
  val:
  - ${to_tensor}
  test: ${transforms.val}
module:
  featurizer:
    _target_: egoemg.models.featurizers.tds.TdsNetwork
    se:
      enable: true
      reduction: 4
      residual: true
      mode: global
    conv_blocks:
    - _target_: egoemg.models.featurizers.tds.Conv1dBlock
      in_channels: 16
      out_channels: 256
      kernel_size: 11
      stride: 5
    - _target_: egoemg.models.featurizers.tds.Conv1dBlock
      in_channels: 256
      out_channels: 256
      kernel_size: 5
      stride: 2
    tds_stages:
    - _target_: egoemg.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 9
      in_conv_stride: 5
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 5
    - _target_: egoemg.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 3
      in_conv_stride: 1
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 3
  decoder:
    _target_: egoemg.models.decoders.transformer.TransformerDecoder
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
    dropout: 0.15
    causal: false
    activation: relu
    norm_first: true
    pos_encoding: rope
    out_proj: true
    preset: middle
  head:
    _target_: egoemg.models.heads.mlp.MLPHead
    in_channels: 256
    out_channels: 22
    hidden_sizes:
    - 512
    activation: relu
    dropout: 0.1
  _target_: egoemg.models.modules.emgformer.Emg2PoseFormer
  out_channels: 22
  provide_initial_pos: false
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices:
- 10
- 12
- 0
- 1
- 2
- 4
- 5
- 6
egoemg_channel_interpolate: false
