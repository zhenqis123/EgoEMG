# @package _global_
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_no_out
  - override /module/decoder: transformer/preset/xxlarge
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_ori
  - _self_
# Algorithm settings
checkpoint: /home/xiziheng/develop/emg2pose/logs/2026-01-03/13-15-46/lightning_logs/version_0/checkpoints/best-monitor_metric=0.0000.ckpt
module:
  provide_initial_pos: False
  decoder:
    causal: true
    preset: large
    pos_encoding: rope
    dropout: 0.1
    in_channels: 256
  head:
    in_channels: 640
# Hyperparameters
optimizer:
  lr: .0003
datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 7_790
  val_test_window_length: 7_790
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: bf16-mixed
  max_epochs: 300

batch_size: 410
matmul_precision: high
