# @package _global_
defaults:
  - /module: emgformer_spatial_rope
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - _self_

checkpoint:

module:
  decoder:
    num_channels: 16
  head:
    in_channels: 256

num_workers: 6
optimizer:
  lr: 0.001
datamodule:
  window_length: 2000
  val_test_window_length: 2000
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0,2]
  precision: bf16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1

batch_size: 900
matmul_precision: high
