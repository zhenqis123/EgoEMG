# @package _global_
# EgoEMG clean training — train split only, val on user/gesture/both
# Per-split val MAE reported: val_stage_mae, val_user_mae, val_user_stage_mae
defaults:
  - /experiment/emgformer/regression_egoemg
  - override /transforms: emgformer_regression_aug_extended
  - _self_

datamodule:
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 1_200
  val_test_stride: 12_000
  norm_mode: null

dataset:
  train:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered_paper
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
      jitter: true
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      excluded_episode_ids: [episode_000029, episode_000030]
      emg_field_preference: filtered_paper
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
      jitter: true

  val:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered_paper
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      excluded_episode_ids: [episode_000029, episode_000030]
      emg_field_preference: filtered_paper
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

  test: []
