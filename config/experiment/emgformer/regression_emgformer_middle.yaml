# @package _global_
defaults:
  - /module: emgformer
  - override /module/decoder: transformer/preset/middle
  - override /transforms: emgformer_regression_aug
  - _self_

# Algorithm settings
module:
  provide_initial_pos: False
  decoder:
    causal: true
    preset: middle
    pos_encoding: rope
    dropout: 0.1
  head:
    in_channels: 256

checkpoint: /home/xiziheng/develop/emg2pose/logs/2025-12-29/11-27-43/lightning_logs/version_0/checkpoints/best-monitor_metric=0.0000.ckpt
# Hyperparameters
optimizer:
  lr: .0005
datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 7_790
  val_test_window_length: 7_790
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: bf16-mixed
  max_epochs: 300
  check_val_every_n_epoch: 1

batch_size: 620
matmul_precision: high
