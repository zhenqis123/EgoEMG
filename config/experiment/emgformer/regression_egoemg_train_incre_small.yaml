# @package _global_
# Small EMGFormer.
# Train: EgoEMG train split (left/right, 22-dim including wrist).
# Val: EgoEMG held-out user/gesture/both splits only.
defaults:
  - /experiment/emgformer/regression_egoemg
  - override /module/decoder: transformer/preset/small
  - override /transforms: rotation_augmentation
  - _self_

checkpoint:

module:
  supervise_at_prediction_rate: false

datamodule:
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 1_200
  val_test_stride: 12_000
  eval_multiprocessing_context: forkserver

dataset:
  train:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
      jitter: true

    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      excluded_episode_ids: [episode_000029, episode_000030]
      emg_field_preference: filtered
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg
      jitter: true

  val:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [user, gesture, both]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      excluded_episode_ids: [episode_000029, episode_000030]
      emg_field_preference: filtered
      emg_layout: target_hand
      channel_interpolate: false
      norm_mode: ${datamodule.norm_mode}
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

  test: []

callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: emg2pose.callbacks.LocalFileModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_top_k: 3
    save_last: true
    save_on_train_epoch_end: false
    filename: "egoemg-only-small-{epoch:03d}-{${monitor_metric}:.4f}"

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_egoemg_only_small
  version: null
  default_hp_metric: false

trainer:
  num_sanity_val_steps: 0