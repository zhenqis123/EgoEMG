# @package _global_
#
# Exact reproduction of the historical WL=14638 ablation recipe.
# Reference: logs/optuna_window/egoemg-window-v4/trial_0006_2026-05-21_11-25-39
#
# Differences from the misnamed `regression_egoemg_window_ablation_wl12000.yaml`
# (which this was previously aliased to):
#   * Featurizer: bespoke (TdsNetwork with 16ch input conv, kernel=9/3 stages,
#     num_blocks=1) — not tds_slim and not the canonical tds_no_out.
#   * Decoder: middle preset (6 layers, dropout=0.15) — not middle_aggressive.
#   * Head: mlp with hidden_sizes=[512].
#   * Transforms: minimal (ExtractField + RotationAugmentation + ToFloatTensor) —
#     not emgformer_regression_aug_extended.
#   * Augmentation: per-key CLI overrides only (no batch_aug defaults).
#   * Channel indices: 0-based (sourced via `egoemg_emg2pose_channel_indices`).
#   * emg_field_preference: filtered (not filtered_paper).
#   * seed=6, batch_size=194.
#   * loss_weights: mae + fingertip_distance only (no landmark/fingertip).
#   * datamodule: no eval_multiprocessing_context override.
defaults:
  - /lineage/emgformer
  - override /module/featurizer: tds_no_out  # placeholder; overridden below
  - override /module/decoder: transformer/preset/middle_aggressive
  - _self_

checkpoint:
pretrained_checkpoint: null
pretrained_strict: false

# egoemg_memmap_dir is supplied via CLI (the active experiment scripts pass
# egoemg_memmap_dir=${EGOEMG_DATA:-data/EgoEMG_memmap} on the command line).
egoemg_emg_field_preference: filtered
# Raw 8-channel layout: pass the 8 channels of the target hand through
# without sparse-place / ring-interpolation. No channel-index mapping
# needed (each hand already has its own memmap column).
egoemg_emg_layout: target_hand
egoemg_emg2pose_channel_indices: null
egoemg_channel_interpolate: false

module:
  out_channels: 22
  provide_initial_pos: false
  # 8-channel featurizer (raw 8ch input, no 16-ch sparse place).
  featurizer:
    se:
      enable: true
      reduction: 4
      residual: true
      mode: global
    conv_blocks:
      - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
        in_channels: 8
        out_channels: 256
        kernel_size: 11
        stride: 5
      - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
        in_channels: 256
        out_channels: 256
        kernel_size: 5
        stride: 2
    tds_stages:
      - _target_: emg2pose.models.featurizers.tds.TdsStage
        in_channels: 256
        in_conv_kernel_width: 9
        in_conv_stride: 5
        num_blocks: 1
        channels: 8
        feature_width: 32
        kernel_width: 5
      - _target_: emg2pose.models.featurizers.tds.TdsStage
        in_channels: 256
        in_conv_kernel_width: 3
        in_conv_stride: 1
        num_blocks: 1
        channels: 8
        feature_width: 32
        kernel_width: 3
  decoder:
    causal: false
    pos_encoding: rope
  head:
    in_channels: 256
    out_channels: 22
    hidden_sizes:
      - 512
    activation: relu
    dropout: 0.1


num_workers: 12

# Minimal transforms (matches trial_0006: ExtractField + RotationAugmentation
# + ToFloatTensor). Do NOT pull in emgformer_regression_aug_extended — its
# extras (e.g. landmark/fingertip loss path) silently change behavior.
to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg
transforms:
  train:
    - _target_: emg2pose.transforms.ExtractField
      field: emg
    - _target_: emg2pose.transforms.RotationAugmentation
      channel_dim: -1
    - _target_: emg2pose.transforms.ToFloatTensor
  val:
    - ${to_tensor}
  test: ${transforms.val}

datamodule:
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  window_length: 14638
  val_test_window_length: 14638
  stride: 1463
  val_test_stride: 14638
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false

optimizer:
  lr: 0.0005

lr_scheduler:
  scheduler:
    eta_min: 5e-6

trainer:
  devices: [0, 1, 2, 3, 4, 5]
  max_epochs: 150
  log_every_n_steps: 5
batch_size: 194

# trial_0006 batch_augmentation (full pipeline, all knobs set explicitly)
batch_augmentation:
  random_gain:
    min_gain: 0.5291
    max_gain: 0.6739
    mask_prob: 0.1422
  mag_warping:
    sigma: 0.177
    num_knots: 15
    mask_prob: 0.0253
  baseline_drift:
    mask_prob: 0.3544
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0154
    max_amp_ratio: 0.0572
  powerline_noise:
    mask_prob: 0.08
    min_amp_ratio: 0.0141
    max_amp_ratio: 0.0628
    max_harmonic: 5
  channel_mask:
    mask_prob: 0.0112
  time_mask:
    num_masks: 6
    max_mask_size: 500
  freq_mask:
    num_masks: 4
    max_mask_size: 128
  gaussian_noise:
    min_snr_db: 44.0937
    max_snr_db: 50.0
    apply_prob: 0.7761

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "egoemg-middle-wl14638-{epoch:03d}-{val_mae:.4f}"

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_egoemg_window_ablation_wl14638
  version: null
  default_hp_metric: false
