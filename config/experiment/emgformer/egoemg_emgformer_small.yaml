# @package _global_
# EMG→pose (EgoEMG) EMGFormer-Small, on the unified EgoEMG memmap.
#
# Mirrors the released egoemg_emgformer_small.ckpt architecture (16-ch
# interpolate16 layout, 3-layer small decoder) and evaluates on the post-merge
# unified memmap (EgoEMG + ShowEE + Incre). EMG field preference = filtered_paper.
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_slim
  - override /module/decoder: transformer/preset/small
  - override /dataset: egoemg_unified_angle_regression
  - override /lr_scheduler: cosine
  - override /transforms: rotation_augmentation
  - _self_

checkpoint: null
pretrained_checkpoint: null
pretrained_strict: false

egoemg_unified_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_unified_memmap
egoemg_emg_field_preference: filtered_paper
egoemg_emg_layout: target_hand
egoemg_emg2pose_channel_indices: null
egoemg_channel_interpolate: false

module:
  out_channels: 22
  provide_initial_pos: false
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
  head:
    in_channels: 256
    out_channels: 22

ignore_head_tail_dims: 0

num_workers: 6

datamodule:
  prefetch_factor: 1
  persistent_workers: true
  pin_memory: false
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 1_200
  val_test_stride: 12_000
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats_repro_filtered_paper_alias.json
  skip_ik_failures: false

optimizer:
  lr: 0.00005

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1
  log_every_n_steps: 5

batch_size: 500
matmul_precision: high

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: egoemg_emgformer_small
  version: null
  default_hp_metric: false
