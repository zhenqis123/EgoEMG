# @package _global_
defaults:
  - /module: emgformer
  - override /module/decoder: transformer/preset/small_middle
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_ori
  - _self_
checkpoint: /home/xiziheng/develop/emg2pose/logs/2026-01-02/23-39-52/lightning_logs/version_0/checkpoints/best-monitor_metric=0.0000.ckpt
# Algorithm settings
module:
  provide_initial_pos: False
  decoder:
    causal: true
    preset: small_middle
    pos_encoding: rope
    dropout: 0.1
  head:
    in_channels: 192
num_workers: 12
# Hyperparameters
optimizer:
  lr: .0001
datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 7_790
  val_test_window_length: 7_790
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: bf16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 2

batch_size: 780
matmul_precision: high
