# @package _global_
# EgoEMG 回归训练基础模板
# 用法: 通过 experiments/regression/*.sh 脚本启动，或直接 CLI override
defaults:
  - /lineage/emgformer
  - override /module/decoder: transformer/preset/middle_aggressive
  - _self_

pretrained_strict: false

egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_incre_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_incre/data_right_merged
egoemg_emg_layout: target_hand
egoemg_emg2pose_channel_indices: null
egoemg_channel_interpolate: false

module:
  provide_initial_pos: false
  decoder:
    causal: false

num_workers: 12

optimizer:
  lr: 0.0005

trainer:
  max_epochs: 150
  log_every_n_steps: 5
callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_top_k: 3
    save_last: true
    filename: "egoemg-middle-{epoch:03d}-{${monitor_metric}:.4f}"

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_egoemg
  version: null
  default_hp_metric: false
