# @package _global_
# 从预训练 checkpoint finetune 到 EgoEMG 的基础模板
# checkpoint 路径由 .sh 脚本通过 CLI override 传入
defaults:
  - /lineage/emgformer
  - override /transforms: emgformer_regression_aug_best
  - override /module/decoder: transformer/preset/middle_aggressive
  - override /augmentation: none
  - _self_

pretrained_strict: false

egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

module:
  provide_initial_pos: false
  decoder:
    causal: false

num_workers: 12

datamodule:
  pin_memory: true

optimizer:
  lr: 0.00001

trainer:
  max_epochs: 50
  log_every_n_steps: 50
callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_top_k: 3
    save_last: true
    filename: "finetune-egoemg-{epoch:03d}-{${monitor_metric}:.4f}"
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    patience: 50

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: finetune_egoemg
  version: null
  default_hp_metric: false
