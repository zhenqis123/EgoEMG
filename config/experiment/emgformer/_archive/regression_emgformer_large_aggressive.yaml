# @package _global_
# Large Aggressive: one step above middle_aggressive with a wider/deeper decoder.
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_slim
  - override /module/decoder: transformer/preset/large_aggressive
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - _self_
checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/2026-04-24/16-05-24_emg2pose/egoemg/version_0/checkpoints/best-val_mae=val_mae=0.2267.ckpt
pretrained_strict: true
module:
  provide_initial_pos: false
  decoder:
    causal: false
    preset: large_aggressive
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 384
    num_heads: 12
    num_layers: 8
    ffn_dim: 1536
  head:
    in_channels: 384

num_workers: 12
datamodule:
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: null
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false

optimizer:
  lr: 0.0001

dataset:
  train:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: false
      allowed_splits: [train]
  val:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: false
      allowed_splits: [val]
  test:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: false
      allowed_splits: [test]

trainer:
  gradient_clip_val: 1
  devices: [0,1,2,3,4,5]
  precision: bf16-mixed
  max_epochs: 250
  check_val_every_n_epoch: 1

batch_size: 400
matmul_precision: high
