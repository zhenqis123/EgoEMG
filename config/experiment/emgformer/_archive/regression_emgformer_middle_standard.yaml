# @package _global_
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_no_out
  - override /module/decoder: transformer/preset/middle
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - _self_

checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/2026-04-06/13-57-35_emg2pose/egoemg/version_0/checkpoints/best-val_mae=val_mae=0.2269.ckpt

pretrained_strict: true
module:
  provide_initial_pos: False
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
  head:
    in_channels: 256

num_workers: 12
# Hyperparameters
optimizer:
  lr: .0001
datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: batch
  norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/emg_norm_stats.npz
  skip_ik_failures: False

# Override dataset to use memmap format (faster loading)
dataset:
  train:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: False
      allowed_splits: [train]
  val:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [val]
  test:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg2pose_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [test]

trainer:
  gradient_clip_val: 1
  devices: [3,4,5]
  precision: 16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1

batch_size: 750
matmul_precision: high