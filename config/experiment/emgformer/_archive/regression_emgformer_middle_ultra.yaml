# @package _global_
# Middle Ultra: Mehlman-style featurizer (~60K, 20x downsample, 100Hz tokens)
# Decoder: middle (256d, 6L, 1024 ffn) — ~5.4M params
# Total: ~5.5M params, featurizer ~1%
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_ultra
  - override /module/decoder: transformer/preset/middle
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - _self_

module:
  provide_initial_pos: false
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 64
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
  head:
    in_channels: 256

num_workers: 12

datamodule:
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false

optimizer:
  lr: .0001

dataset:
  train:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: false
      allowed_splits: [train]
  val:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: false
      allowed_splits: [val]
  test:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: false
      allowed_splits: [test]

trainer:
  gradient_clip_val: 1
  devices: [3,4,5]
  precision: bf16-mixed
  max_epochs: 150
  check_val_every_n_epoch: 1

batch_size: 600
matmul_precision: high
