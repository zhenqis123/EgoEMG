# @package _global_
defaults:
  - /module: emgformer
  - override /module/featurizer: tds_slim
  - override /module/decoder: transformer/preset/small
  - override /dataset: egoemg_angle_regression
  - override /lr_scheduler: cosine
  - override /transforms: rotation_augmentation
  - _self_

checkpoint: ${oc.env:EGOEMG_ROOT,.}/logs/2026-05-05/00-24-04_emg2pose/regression_emgformer_small_aggressive_egoemg/version_0/checkpoints/last.ckpt
pretrained_checkpoint: null
pretrained_strict: false

egoemg_memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

module:
  out_channels: 22
  provide_initial_pos: false
  decoder:
    causal: false
    preset: small
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
  head:
    in_channels: 256
    out_channels: 22

ignore_head_tail_dims: 0

num_workers: 6

datamodule:
  prefetch_factor: 1
  persistent_workers: true
  pin_memory: false
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 780
  val_test_stride: 7_790
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EGOEMG_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false

optimizer:
  lr: 0.00005

trainer:
  gradient_clip_val: 1
  devices: [1,2,3,4,5]
  # devices: 1
  precision: bf16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1
  log_every_n_steps: 5

batch_size: 500
matmul_precision: high

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "egoemg-small-{epoch:03d}-{val_mae:.4f}"

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_emgformer_small_aggressive_egoemg
  version: null
  default_hp_metric: false
