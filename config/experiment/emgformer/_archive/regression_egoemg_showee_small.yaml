# @package _global_
# Full-data EMGFormer-S: EgoEMG + Incre + ShowEE train, EgoEMG-only val/test.
defaults:
  - /experiment/emgformer/regression_egoemg_showee
  - _self_

module:
  decoder:
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
    dropout: 0.1
  head:
    in_channels: 256
    out_channels: 22

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "egoemg-incre-showee-small-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor

logger:
  name: regression_egoemg_incre_showee_small
