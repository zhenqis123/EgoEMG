# @package _global_
defaults:
  - /module: emgformer_pretrain
  - override /module/featurizer: tds_no_out
  - override /module/decoder: transformer/preset/middle
  - override /lr_scheduler: warmup_cosine
  - override /transforms: pretrain_mae
  - _self_

module:
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
  recon_head:
    in_channels: 256
    out_channels: 16
  angle_head:
    in_channels: 256
    out_channels: 22
  gesture_head:
    in_channels: 256
    out_channels: ${gesture_num_classes}
  keystroke_head:
    in_channels: 256

num_workers: 12
optimizer:
  lr: 0.001

loss_weights:
  recon: 1.0
  angle: 1.0
  gesture: 0.5
  keystroke: 0.5
datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: batch
  norm_stats_path: ${oc.env:EGOEMG_ROOT,.}/assets/emg_norm_stats.npz
  skip_ik_failures: False
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

trainer:
  gradient_clip_val: 1
  devices: [1,2,4]
  precision: bf16-mixed
  max_epochs: 500
  limit_val_batches: 0  # 关闭验证
  log_every_n_steps: 10  # 每10步显示一次loss

batch_size: 620
matmul_precision: high