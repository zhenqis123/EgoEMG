# @package _global_
# Finetune middle_aggressive supervised pretrain checkpoint on emg2pose memmap.
# Uses 22-dim angle head (matching pretrain), ignoring last 2 dims in supervision.
# Supports loading both pretrain checkpoints (22-dim head) and regular model
# checkpoints (20-dim head, auto-padded to 22).
defaults:
  - /module: emgformer
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - override /module/featurizer: tds_slim
  - override /module/decoder: transformer/preset/middle
  - _self_

data_root: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus
data_location: ${data_root}/emg2pose_v3_memmap

checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/2026-04-08/17-05-45_emg2pose/logs/emg2pose_finetune/finetune_from_pretrain/version_0/checkpoints/finetune-epoch=026-val_mae=0.2300.ckpt
pretrained_strict: true

module:
  out_channels: 22
  provide_initial_pos: False
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
  head:
    in_channels: 256
    out_channels: 22  # Match pretrain

# Don't supervise last 2 dims (pretrain has 22, emg2pose has 20)
ignore_head_tail_dims: 2

dataset:
  train:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${data_location}
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: False
      allowed_splits: [train]
  val:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${data_location}
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [val]
  test:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${data_location}
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [test]

num_workers: 12

# Unified learning rate
optimizer:
  lr: 0.00001

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 7_790
  val_test_stride: 7_790
  norm_mode: batch
  norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/emg_norm_stats.npz
  skip_ik_failures: False
  prefetch_factor: 3
  persistent_workers: true
  pin_memory: true

trainer:
  gradient_clip_val: 1
  devices: [3]
  precision: bf16-mixed
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

batch_size: 768
matmul_precision: high

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "finetune-middle-aggr-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 50

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/emg2pose_finetune
  name: finetune_from_pretrain_middle_aggressive
  version: null
  default_hp_metric: false
