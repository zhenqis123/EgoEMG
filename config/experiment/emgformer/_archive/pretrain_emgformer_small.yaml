# @package _global_
defaults:
  - /module: emgformer_pretrain
  - override /module/featurizer: tds_no_out
  - override /module/decoder: transformer/preset/small
  - override /lr_scheduler: cosine
  - override /transforms: pretrain_mae
  - _self_

checkpoint: /home/xiziheng/develop/emg2pose/logs/pretrain/2026-02-13/01-33-12/tensorboard/version_0/checkpoints/epoch=101-step=30804.ckpt
module:
  decoder:
    causal: false
    preset: small
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
  recon_head:
    in_channels: 128
    out_channels: 16
  angle_head:
    in_channels: 128
    out_channels: 22
  gesture_head:
    in_channels: 128
    out_channels: ${gesture_num_classes}

num_workers: 12
optimizer:
  lr: 0.0005

loss_weights:
  recon: 1.0
  angle: 1.0
  gesture: 0.5
  keystroke: 0.1
datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

trainer:
  gradient_clip_val: 1
  devices: [0,2,3,4]
  precision: 32
  max_epochs: 500
  log_every_n_steps: 10  # 每10步显示一次loss

batch_size: 600