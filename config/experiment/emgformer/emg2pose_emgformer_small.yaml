# @package _global_
# emg2pose_v3 回归训练基础模板
# Note: not migrated to lineage/emgformer — uses emg2pose_v3 dataset
# (not EgoEMG), so doesn't match the EgoEMG emgformer lineage assumptions.

defaults:
  - /module: emgformer
  - override /module/featurizer: tds_slim_16ch
  - override /module/decoder: transformer/preset/small
  - override /transforms: emgformer_regression_aug_best
  - override /datamodule: egoemg
  - _self_

# README's EMG2Pose table reports per-user mean ± std; the official
# re-evaluation script enables this flag for the emg2pose path.
per_user: true
pretrained_strict: true

module:
  out_channels: 20
  head:
    out_channels: 20
  provide_initial_pos: false
  decoder:
    causal: false

num_workers: 12

datamodule:
  # The released S checkpoint is trained with per-dataset normalization,
  # same recipe as M/L.
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EGOEMG_ROOT,.}/assets/per_dataset_norm_stats.json
  # 50% window overlap: one epoch covers every row exactly once at 1/5th
  # the window count of the legacy stride 780 (90% overlap).
  stride: 3900
  # Validation workers fork only at the first validation, long after the
  # parent's CUDA context is heavily used; forked children then die on
  # 'CUDA error: initialization error' when deallocating inherited CUDA
  # tensors. Spawn gives eval workers a clean interpreter instead.
  eval_multiprocessing_context: spawn

dataset:
  train:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg2pose_memmap
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      padding: [0, 0]
      jitter: true
      skip_ik_failures: False
      allowed_splits: [train]
      # 'time' never reaches the training sample dict; skipping it saves
      # ~9% of read+IPC+H2D payload per batch.
      skip_fields: [time]
  val:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg2pose_memmap
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [val]
  test:
    - _target_: egoemg.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg_corpus/emg2pose_v3
      memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg2pose_memmap
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [test]

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  max_epochs: 250
  check_val_every_n_epoch: 1
  devices: [0]

callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: ${monitor_metric}
    mode: ${monitor_mode}
    save_top_k: 3
    save_last: true
    filename: "emg2pose-{epoch:03d}-{${monitor_metric}:.4f}"

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_emg2pose
  version: null
  default_hp_metric: false
