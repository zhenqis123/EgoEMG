# @package _global_
# Public training entrypoint; fit train and select checkpoints on val only.
defaults:
- /lineage/emgformer_session
- _self_
train: true
eval: false
checkpoint: null
resume_ckpt: null
pretrained_checkpoint: null
batch_size: 32
val_batch_size: 32
num_workers: 4
trainer:
  devices:
  - 0
  strategy: auto
  min_epochs: 0
  check_val_every_n_epoch: 1
hydra:
  run:
    dir: logs/training/emgformer_s/${now:%Y-%m-%d_%H-%M-%S}
