# @package _global_
# Migrated to inherit lineage/fusion.yaml (framework defaults).
# Business params preserved verbatim; resolved config identical to pre-migration.
# ResNet50 + EMGFormer Small Fusion
# Vision: ResNet50 backbone (frozen) from vision_resnet_large checkpoint → 2048-dim features
# EMG:    EMGFormer small featurizer+decoder (frozen) from EMG checkpoint → 256-dim
# Fusion: vision_proj → concat with decoder output → fusion_proj → residual head
#
# Stage 2 paradigm: vision backbone loaded via vision_pretrained_checkpoint,
# EMG backbone loaded via pretrained_emg_checkpoint, fusion layers trained.
defaults:
  - /lineage/fusion
  - /module: mid_fusion
  - override /transforms: emgformer_regression_aug_best
  - override /module/featurizer: tds_slim
  - _self_

# ── Data paths ───────────────────────────────────────────────────────────────
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

# ── Vision (ResNet50, pre-crops) ─────────────────────────────────────────────
per_episode_crops_dir: /mnt/nvme/xiziheng/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false

# ── Checkpoints ──────────────────────────────────────────────────────────────
# Set vision_resnet_checkpoint to the trained vision_resnet_large baseline ckpt
vision_resnet_checkpoint: null
# EMGFormer small (featurizer + decoder only)
pretrained_emg_checkpoint: /home/xiziheng/develop/emg2pose/logs/2026-04-30/23-28-41_emg2pose/regression_emgformer_small_aggressive_egoemg/version_0/checkpoints/egoemg-small-epoch=007-val_mae=0.2625.ckpt

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: resnet_large_emgfusion
    chdir: false

# ── Not used (config compatibility) ──────────────────────────────────────────
wilor_checkpoint_path: /home/xiziheng/develop/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/develop/WiLoR/mano_data

# ── Training ─────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
batch_size: 128
val_batch_size: 200
num_workers: 8

trainer:
  devices: [0,1,2,3,4,5]
  max_epochs: 300
  check_val_every_n_epoch: 2
  log_every_n_steps: 1
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 400
  val_test_stride: 7790
  dataset_repeat: 1
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  delta_reg: 0.1

# ── Module ───────────────────────────────────────────────────────────────────
module:
  vision_backbone_type: resnet50
  vision_embed_dim: 2048
  vision_pretrained_checkpoint: ${vision_resnet_checkpoint}
  skip_vision_backbone: false
  fusion_mode: fusion
  moddrop_prob: 0.3
  out_channels: 22
  provide_initial_pos: false
  emg_feat_dim: 256
  fusion_proj_dim: 256
  decoder:
    causal: false
    preset: small
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
  head:
    in_channels: 256
    out_channels: 22

# ── Component LR scales: freeze pretrained backbones ───────────────────────
component_lr_scales:
  featurizer: 0.0
  decoder: 0.0
  vision_backbone: 0.0
  vision_proj: 1.0
  fusion_proj: 1.0
  head: 1.0
  head_vision: 1.0


callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "resnet-large-emgfusion-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 40
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: resnet_large_emgfusion
  version: null
  default_hp_metric: false
