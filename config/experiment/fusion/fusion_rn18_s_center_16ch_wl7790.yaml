# @package _global_
# Eval/repro config for the trained ResNet18 + EMGFormer-S fusion checkpoint.
#
# IMPORTANT: this config matches the checkpoints actually produced by training
# (see logs/fusion/resnet_small_emgfusion_center/*/checkpoints/): 16 EMG
# channels (emg2pose_interpolate16 + tds_slim_16ch), WL=7790, stride=400,
# val_stride=7790, per-dataset norm from assets/per_dataset_norm_stats.json.
# The older "8ch" configs (fusion_rn18_s_center_8ch*) use an 8-channel
# target_hand layout + WL=12000 and DO NOT load these checkpoints (shape
# mismatch on featurizer conv). Use this config for center-frame evaluation:
#
#   python -m egoemg.test_analysis \
#     experiment=fusion/fusion_rn18_s_center_16ch_wl7790 \
#     'checkpoint=logs/fusion/resnet_small_emgfusion_center/version_15/checkpoints/resnet-small-centerfusion-epoch=099-val_mae=0.0944.ckpt' \
#     'trainer.devices=[0]'
#
# Note: checkpoint filenames containing '=' break Hydra CLI overrides; pass the
# path via `checkpoint=` only when it has no '=' (symlink otherwise, or put the
# path in `checkpoint:` in a user config).
defaults:
  - /lineage/fusion
  - /module: mid_fusion
  - override /transforms: emgformer_regression_aug_extended
  - override /module/featurizer: tds_slim_16ch
  - _self_

# ── Data paths ───────────────────────────────────────────────────────────────
egoemg_unified_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_unified_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
egoemg_emg_field_preference: filtered_paper

# ── Vision (ResNet18, pre-crops) ─────────────────────────────────────────────
per_episode_crops_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false
center_target_only: true

# ── Legacy release checkpoint initializers ───────────────────────────────────
# Download with scripts/download/download_checkpoints.sh, or set
# EGOEMG_CHECKPOINT_ROOT to a directory containing these legacy filenames.
vision_resnet_checkpoint: ${oc.env:EGOEMG_CHECKPOINT_ROOT,checkpoints}/vision_resnet18.ckpt
pretrained_emg_checkpoint: ${oc.env:EGOEMG_CHECKPOINT_ROOT,checkpoints}/egoemg_emgformer_small.ckpt
checkpoint:

# ── Not used by the ResNet-18 fusion implementation ──────────────────────────
wilor_checkpoint_path: null
mano_model_path: null

# ── Training ─────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
batch_size: 200
val_batch_size: 100
num_workers: 10

trainer:
  devices: [0]
  max_epochs: 150
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 400
  val_test_stride: 7_790
  dataset_repeat: 2
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  delta_reg: 0.0

# ── Module (matches trained checkpoint architecture) ─────────────────────────
module:
  vision_backbone_type: resnet18
  vision_embed_dim: 512
  vision_pretrained_checkpoint: ${vision_resnet_checkpoint}
  skip_vision_backbone: false
  fusion_mode: center_supervised
  moddrop_prob: 0.0
  force_zero_emg: false
  out_channels: 22
  provide_initial_pos: false
  emg_feat_dim: 256
  fusion_proj_dim: 256
  decoder:
    causal: false
    pos_encoding: rope
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
    dropout: 0.15
  head:
    in_channels: 256
    out_channels: 22

component_lr_scales:
  featurizer: 1.0
  decoder: 1.0
  vision_backbone: 1.0
  vision_proj: 1.0
  fusion_proj: 1.0
  head: 1.0
  head_vision: 1.0


callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "rn18-s-16ch-wl7790-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: resnet_small_emgfusion_center
  version: null
  default_hp_metric: false

center_frame_eval: true
