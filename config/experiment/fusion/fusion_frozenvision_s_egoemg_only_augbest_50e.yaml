# @package _global_
# Shared ViT recipe corresponding to the RN cross-attention study.  The
# pretrained visual predictor is held fixed; temporal EMG tokens query the
# ViT spatial patch grid and predict a center-frame residual.
defaults:
  - /experiment/fusion/fusion_rn18_s_egoemg_only_augbest_pretrained
  - _self_

checkpoint: null
pretrained_emg_checkpoint: ${oc.env:EMG2POSE_ROOT,.}/test_results/egoemg_emgformer_small_incre_cotrain/checkpoints/best.ckpt

trainer:
  max_epochs: 50

datamodule:
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 400
  val_test_stride: 12_000
  dataset_repeat: 2

optimizer:
  lr: 1.0e-5

lr_scheduler:
  scheduler:
    T_max: 50
    eta_min: 5.0e-8

module:
  fusion_mode: frozen_cross_attention
  freeze_vision_branch: true
  freeze_vision_head: true
  vision_trainable_prefixes: null
  lock_vision_batch_norm: true
  cross_attention_dim: 256
  cross_attention_num_heads: 8
  cross_attention_ffn_dim: 512
  cross_attention_dropout: 0.1
  cross_attention_max_vision_grid_size: 20
  cross_attention_num_layers: 1

component_lr_scales:
  vision_backbone: 0.0
  head_vision: 0.0

anchor_loss_weight: 1.0

logger:
  name: fusion_frozenvision_s_egoemg_only_augbest_50e
