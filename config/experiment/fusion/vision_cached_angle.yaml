# @package _global_
# Mid Fusion (Cached ViT Features): EMG + precomputed ViT feature concat
# Skips ViT backbone entirely during training — loads (1280,) features from LMDB
#
# Frozen:    nothing (ViT backbone not used)
# Trainable: vision_proj, fusion_proj, EMGFormer (featurizer+decoder+head) → optimizer.lr
#
# EMG params aligned with regression_emgformer_middle_aggressive_egoemg
defaults:
  - /module: mid_fusion
  - /dataset: egoemg_angle_regression
  - /datamodule: default
  - /transforms: emgformer_regression_aug_best
  - /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# ── EMG data ────────────────────────────────────────────────────────────────
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
egoemg_skip_fields: [label_gesture_class, label_gesture_active]

# ── Cached ViT features ─────────────────────────────────────────────────────
cached_vit_features_dir: data/EgoEMG_v2_vit_features_lmdb

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: mid_fusion_cached
    chdir: false

# ── WiLoR (not used for inference, kept for config compatibility) ────────────
wilor_checkpoint_path: ${oc.env:WILOR_PATH,../WiLoR}/pretrained_models/wilor_final.ckpt
mano_model_path: ${oc.env:WILOR_PATH,../WiLoR}/mano_data

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
# checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/fusion/mid_fusion_cached_aggressive/version_13/checkpoints/reinit.ckpt
checkpoint:
# ── Stage 2: load vision weights from vision_only ckpt ────────────────────────
# Comment out or set to null to train from scratch (Stage 1).
# Set to a vision_only checkpoint path to initialize vision_proj, fusion_proj, head.
stage2_vision_checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/fusion/vision_stage1/version_62/checkpoints/last.ckpt  # e.g. logs/fusion/.../version_2/checkpoints/last.ckpt
# ── Optional: load EMG backbone (featurizer + decoder) from EMG-only ckpt ──────
# Skips angle head — only featurizer + decoder weights are loaded.
pretrained_emg_checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/2026-04-29/11-06-44_emg2pose/regression_emgformer_middle_aggressive_egoemg/version_0/checkpoints/egoemg-epoch=087-val_mae=0.2629.ckpt  # e.g. logs/.../egoemg-epoch=087-val_mae=0.2629.ckpt
# Per-component LR scales (applied to base optimizer.lr). 0 = freeze.
component_lr_scales:
  featurizer: 0.0
  decoder: 0.0
  vision_proj: 1.0
  fusion_proj: 1.0
  head: 1.0
  head_vision: 1.0
batch_size: 640
val_batch_size: 600
num_workers: 8
prefetch_factor: 4
persistent_workers: true
matmul_precision: high

trainer:
  gradient_clip_val: 1
  devices: [0,1,2,3,4,5]
  precision: bf16-mixed
  max_epochs: 500
  check_val_every_n_epoch: 1
  log_every_n_steps: 1

optimizer:
  _target_: torch.optim.Adam
  lr: 5.0e-5
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 400
  val_test_stride: 7790
  dataset_repeat: 1
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  pin_memory: false

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  delta_reg: 0.1

# ── Module ──────────────────────────────────────────────────────────────────
# fusion_mode: fusion | emg_only | vision_only
#   - fusion:       EMG decoder + ViT feature concat (default)
#   - emg_only:     zero out vision features, EMG-only prediction
#   - vision_only:  zero out EMG, vision-only prediction
module:
  skip_vision_backbone: true
  fusion_mode: fusion
  moddrop_prob: 0.3
  out_channels: 22
  provide_initial_pos: false
  vision_embed_dim: 1280
  emg_feat_dim: 256
  fusion_proj_dim: 256
  vision_pretrained_checkpoint: ${wilor_checkpoint_path}
  mano_model_path: ${mano_model_path}
  vision_freeze: ${vision_freeze}
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
  head:
    in_channels: 256
    out_channels: 22

# ── Vision freeze (not needed since ViT is not used, but kept for compatibility) ─
vision_freeze:
  strategy: simple
  frozen_block_end: 32
  freeze_patch_embed: true
  freeze_pos_embed: true
  freeze_mano_tokens: true
  finetune_last_norm: false

ignore_head_tail_dims: 0

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "fusion-cached-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 30
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: mid_fusion_cached_aggressive
  version: null
  default_hp_metric: false
