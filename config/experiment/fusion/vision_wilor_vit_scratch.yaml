# @package _global_
# Migrated to inherit lineage/fusion.yaml (framework defaults).
# Business params preserved verbatim; resolved config identical to pre-migration.
# WiLoR ViT Vision-Only — Random Initialization (no pretrained weights).
# Identical architecture to vision_wilor_vit but trained from scratch.
# Purpose: measure the contribution of WiLoR → ViTPose → MAE pretraining.

defaults:
  - /lineage/fusion
  - /module: wilor_vit
  - override /transforms: noop
  - _self_

# ── EMG data (skipped — vision-only) ───────────────────────────────────────
egoemg_unified_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_unified_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
skip_emg_loading: true

# ── Pre-cropped images ──────────────────────────────────────────────────────
per_episode_crops_dir: data/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256

# ── No pretrained checkpoint ─────────────────────────────────────────────────
wilor_checkpoint_path: null

# ── Hydra output ────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: vision_wilor_vit_scratch
    chdir: false

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
component_lr_scales:
  backbone: 1.0
  head: 1.0
batch_size: 18
val_batch_size: 18
num_workers: 8

trainer:
  devices: [0,1,2,3,4,5]
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-2

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 1560
  val_test_stride: 7790
  dataset_repeat: 2
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

# ── Module ──────────────────────────────────────────────────────────────────
module:
  _target_: egoemg.models.modules.wilor_vit.WiLoRViTPose
  out_channels: 22
  pretrained_path: null
  head_hidden: 512
  head_dropout: 0.1


callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "wilor-vit-scratch-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 50
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: data/logs/fusion
  name: vision_wilor_vit_scratch
  version: null
  default_hp_metric: false
