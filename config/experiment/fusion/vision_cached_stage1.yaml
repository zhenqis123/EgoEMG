# @package _global_
# Stage 1 Vision Baseline: single-frame → single-pose.
# vision_proj loaded from old ckpt, head_vision trained from scratch.
# Center-frame supervision only — one image can only predict one pose.
# In Stage 2 fusion, y_v is broadcast over all time steps, EMG adds per-frame residual.
#
# Stage 2: set fusion_mode=fusion, load this checkpoint, train EMG residual branch.

defaults:
  - /module: mid_fusion
  - /dataset: egoemg_angle_regression
  - /datamodule: default
  - /transforms: noop
  - /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# ── EMG data (skipped in vision_only mode) ───────────────────────────────────
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
skip_emg_loading: true

# ── Cached ViT features ─────────────────────────────────────────────────────
cached_vit_features_dir: /mnt/nvme/xiziheng/EgoEMG_v2_vit_features_lmdb
preload_features: true

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: vision_stage1
    chdir: false

# ── WiLoR (not used, kept for config compatibility) ─────────────────────────
wilor_checkpoint_path: /home/xiziheng/develop/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/develop/WiLoR/mano_data

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
checkpoint: /home/xiziheng/develop/emg2pose/logs/fusion/vision_stage1/version_58/checkpoints/last.ckpt
# Set to a previous vision_only checkpoint to initialize vision_proj weights.
# stage2_vision_checkpoint: /home/xiziheng/develop/emg2pose/logs/fusion/mid_fusion_cached_aggressive/version_1/checkpoints/last.ckpt
# Only vision_proj + head_vision are active in vision_only mode.
component_lr_scales:
  featurizer: 0.0
  decoder: 0.0
  vision_proj: 1.0
  fusion_proj: 0.0
  head: 0.0
  head_vision: 1.0
batch_size: 48000
val_batch_size: 128
num_workers: 12
prefetch_factor: 2
persistent_workers: true
matmul_precision: high

trainer:
  gradient_clip_val: 1
  devices: [0,1,2]
  precision: bf16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1
  log_every_n_steps: 1

optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-5
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 100
  val_test_stride: 7790
  dataset_repeat: 20
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  pin_memory: false

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

# ── Module ──────────────────────────────────────────────────────────────────
module:
  skip_vision_backbone: true
  fusion_mode: vision_only
  moddrop_prob: 0.0
  out_channels: 22
  provide_initial_pos: false
  vision_embed_dim: 1280
  emg_feat_dim: 256
  fusion_proj_dim: 256
  input_emg_length: ${datamodule.window_length}
  vision_pretrained_checkpoint: ${wilor_checkpoint_path}
  mano_model_path: ${mano_model_path}
  vision_freeze: ${vision_freeze}
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
  head:
    in_channels: 256
    out_channels: 22

vision_freeze:
  strategy: simple
  frozen_block_end: 32
  freeze_patch_embed: true
  freeze_pos_embed: true
  freeze_mano_tokens: true
  finetune_last_norm: false

ignore_head_tail_dims: 0

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "vision-stage1-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 30
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: vision_stage1
  version: null
  default_hp_metric: false
