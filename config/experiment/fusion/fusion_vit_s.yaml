# @package _global_
# Public training entrypoint; fit train and select checkpoints on val only.
defaults:
- /lineage/fusion_residual
- _self_
fusion_vision_checkpoint: ${oc.env:EGOEMG_CHECKPOINT_ROOT,pretrained_models/egoemg}/vision_vit_s.ckpt
fusion_emg_checkpoint: ${oc.env:EGOEMG_CHECKPOINT_ROOT,pretrained_models/egoemg}/emgformer_s.ckpt
checkpoint: null
resume_ckpt: null
pretrained_checkpoint: null
pretrained_emg_checkpoint: null
train: true
eval: false
batch_size: 16
val_batch_size: 16
num_workers: 4
dense_frame_cache: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG_dataset/fullframe_256_30fps
trainer:
  devices:
  - 0
  strategy: auto
hydra:
  run:
    dir: logs/training/fusion_vit_s/${now:%Y-%m-%d_%H-%M-%S}
