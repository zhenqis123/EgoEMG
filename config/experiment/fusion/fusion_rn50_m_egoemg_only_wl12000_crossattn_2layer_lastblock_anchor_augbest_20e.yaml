defaults:
  - /experiment/fusion/fusion_rn50_m_egoemg_only_noaug_wl12000_crossattn_lastblock_anchor_augbest_20e
  - _self_

module:
  cross_attention_num_layers: 2

logger:
  name: fusion_rn50_m_egoemg_only_wl12000_crossattn_2layer_lastblock_anchor_augbest_20e

center_frame_eval: true
