# @package _global_
# Vision-only ResNet34 training on the mixed EgoEMG + ShowEE dataset.
defaults:
  - /experiment/fusion/vision_resnet_middle
  - override /dataset: egoemg_unified_angle_regression
  - _self_

showee_memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/ShowEE_202607_memmap
showee_video_root: ${oc.env:EGOEMG_ROOT,.}/data/showee
showee_allintra_root: ${oc.env:EGOEMG_ROOT,.}/data/ShowEE_202607_allintra
showee_per_episode_crops_dir: ${oc.env:EGOEMG_ROOT,.}/data/ShowEE_202607_crops

egoemg_video_root: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG
egoemg_allintra_root: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG_videos
egoemg_per_episode_crops_dir: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG_crops

datamodule:
  per_dataset_norm_stats_path: ${oc.env:EGOEMG_ROOT,.}/assets/per_dataset_norm_stats_repro_filtered_paper_alias.json

logger:
  name: vision_resnet_middle_egoemg_showee

center_frame_eval: true
