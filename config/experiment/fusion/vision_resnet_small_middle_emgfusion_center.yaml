# @package _global_
# ResNet18 + EMGFormer Middle Fusion — Center-Supervised
# Full EMG temporal window → attention-pooled → fused with vision → center frame only
# Fair comparison with vision-only: same supervision target, same architecture backbone
#
# EMG:  EMGFormer middle featurizer+decoder (trainable) → temporal attention pool → 256-dim
# Vision: ResNet18 backbone (trainable) + head_vision (trainable) → y_v
# Fusion: concat[emg_pooled, vision_proj] → fusion_proj → head → delta (all trainable)
# preds = y_v + delta  (center frame only, 22-dim)
defaults:
  - /module: mid_fusion
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /transforms: emgformer_regression_aug_best
  - override /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# ── Data paths ───────────────────────────────────────────────────────────────
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

# ── Vision (ResNet18, pre-crops) ─────────────────────────────────────────────
per_episode_crops_dir: /mnt/nvme/xiziheng/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false
center_target_only: true

# ── Checkpoints ──────────────────────────────────────────────────────────────
vision_resnet_checkpoint: /home/xiziheng/develop/emg2pose/logs/fusion/vision_resnet/version_9/checkpoints/last.ckpt
pretrained_emg_checkpoint: /home/xiziheng/develop/emg2pose/logs/2026-04-29/00-54-45_emg2pose/regression_emgformer_middle_aggressive_egoemg/version_0/checkpoints/egoemg-epoch=045-val_mae=0.2624.ckpt

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: resnet_small_middle_emgfusion_center
    chdir: false

# ── Not used (config compatibility) ──────────────────────────────────────────
wilor_checkpoint_path: /home/xiziheng/develop/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/develop/WiLoR/mano_data

# ── Training ─────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
batch_size: 600
val_batch_size: 200
num_workers: 10
matmul_precision: high

trainer:
  gradient_clip_val: 1
  devices: [0,1,2,3,4,5]
  precision: bf16-mixed
  max_epochs: 300
  check_val_every_n_epoch: 1
  log_every_n_steps: 1

optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 400
  val_test_stride: 7790
  dataset_repeat: 2
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  delta_reg: 0.0

# ── Module ───────────────────────────────────────────────────────────────────
module:
  vision_backbone_type: resnet18
  vision_embed_dim: 512
  vision_pretrained_checkpoint: ${vision_resnet_checkpoint}
  skip_vision_backbone: false
  fusion_mode: center_supervised
  moddrop_prob: 0.0
  force_zero_emg: false
  out_channels: 22
  provide_initial_pos: false
  emg_feat_dim: 256
  fusion_proj_dim: 256
  decoder:
    causal: false
    preset: middle
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 4
    ffn_dim: 1024
  head:
    in_channels: 256
    out_channels: 22

# ── Component LR scales: all components trainable ────────────────────────────
component_lr_scales:
  featurizer: 1.0
  decoder: 1.0
  vision_backbone: 1.0
  vision_proj: 1.0
  fusion_proj: 1.0
  head: 1.0
  head_vision: 1.0

ignore_head_tail_dims: 0

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "resnet-small-middle-centerfusion-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 40
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: resnet_small_middle_emgfusion_center
  version: null
  default_hp_metric: false
