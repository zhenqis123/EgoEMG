# @package _global_
# Pure Vision MLP baseline: frozen ViT features → MLP → joint angles
# No EMG, no decoder, no fusion — simplest vision-only baseline
#
# Trainable: MLP only (~0.7M params)

defaults:
  - /dataset: egoemg_unified_angle_regression
  - /datamodule: default
  - /transforms: emgformer_regression_aug_best
  - /lr_scheduler: cosine
  - _self_

# ── EMG data ────────────────────────────────────────────────────────────────
egoemg_unified_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_unified_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

# ── Cached ViT features ─────────────────────────────────────────────────────
cached_vit_features_dir: data/EgoEMG_v2_vit_features_lmdb

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/vision_mlp/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: vision_mlp
    chdir: false

# ── WiLoR (not used, kept for config compatibility) ──────────────────────────
wilor_checkpoint_path: ${oc.env:WILOR_PATH,../WiLoR}/pretrained_models/wilor_final.ckpt
mano_model_path: ${oc.env:WILOR_PATH,../WiLoR}/mano_data

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
checkpoint: null
batch_size: 1024
val_batch_size: 256
num_workers: 4
prefetch_factor: 2
persistent_workers: true
matmul_precision: high

trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: bf16-mixed
  max_epochs: 100
  check_val_every_n_epoch: 5
  log_every_n_steps: 10

optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-3
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 780
  val_test_stride: 7790
  dataset_repeat: 1
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  pin_memory: true

loss_weights:
  mae: 1.0

# ── Module ──────────────────────────────────────────────────────────────────
module:
  _target_: egoemg.models.modules.vision_mlp.VisionMLP
  vision_embed_dim: 1280
  hidden_dims: [512, 256]
  out_channels: 22
  dropout: 0.1

ignore_head_tail_dims: 0

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "vision-mlp-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 30
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/vision_mlp
  name: vision_mlp_baseline
  version: null
  default_hp_metric: false
