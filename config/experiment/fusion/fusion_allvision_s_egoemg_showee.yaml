# @package _global_
# Generic full-data fusion template. Runtime overrides select the vision
# backbone/checkpoint. Training uses EgoEMG + ShowEE and excludes Incre.
defaults:
  - /experiment/fusion/fusion_rn18_s_center_8ch_egoemg_showee
  - override /dataset: egoemg_unified_angle_regression
  - _self_

checkpoint: null
pretrained_emg_checkpoint: null

trainer:
  devices: [0, 1, 2, 3, 4, 5]
  max_epochs: 150

datamodule:
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 1_200
  val_test_stride: 12_000
  eval_center_stride: 7_790

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "fusion-s-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor

logger:
  name: fusion_allvision_s_egoemg_showee
