# @package _global_
# Migrated to inherit lineage/fusion.yaml (framework defaults).
# Business params preserved verbatim; resolved config identical to pre-migration.
# ViT Vision-Only Baseline (Middle) — online ViT, trainable, no WiLoR checkpoint.
# DINOv2 ViT backbone (trainable) → 256-dim projection → [512] MLP head → 22 joint angles
# Center-frame supervision only — one image predicts one pose.

defaults:
  - /lineage/fusion
  - /module: mid_fusion
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /transforms: noop
  - override /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# ── EMG data (skipped in vision_only mode) ───────────────────────────────────
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
skip_emg_loading: true

# ── Vision (online ViT, pre-crops) ───────────────────────────────────────────
per_episode_crops_dir: /mnt/nvme/xiziheng/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: vision_vit_middle
    chdir: false

# ── MANO config only (architecture building, no weights loaded) ──────────────
mano_model_path: /home/xiziheng/develop/WiLoR/mano_data

# ── Training ────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
component_lr_scales:
  featurizer: 0.0
  decoder: 0.0
  vision_backbone: 1.0
  vision_proj: 1.0
  fusion_proj: 0.0
  head: 0.0
  head_vision: 1.0
batch_size: 64
val_batch_size: 32
num_workers: 8

trainer:
  devices: [0,1,2,3,4,5]
  max_epochs: 200
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 400
  val_test_stride: 7790
  dataset_repeat: 2
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

# ── Module ──────────────────────────────────────────────────────────────────
module:
  vision_backbone_type: vit
  skip_vision_backbone: false
  fusion_mode: vision_only
  moddrop_prob: 0.0
  out_channels: 22
  provide_initial_pos: false
  vision_embed_dim: 1280
  emg_feat_dim: 256
  fusion_proj_dim: 256
  input_emg_length: ${datamodule.window_length}
  vision_pretrained_checkpoint: null
  mano_model_path: ${mano_model_path}
  vision_freeze: ${vision_freeze}
  decoder:
    causal: false
    preset: small
    pos_encoding: rope
    dropout: 0.15
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
  head:
    in_channels: 256
    out_channels: 22

vision_freeze:
  strategy: simple
  frozen_block_end: 0
  freeze_patch_embed: false
  freeze_pos_embed: false
  freeze_mano_tokens: false
  finetune_last_norm: true


callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "vit-middle-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_mae
    mode: min
    patience: 30
    check_on_train_epoch_end: false

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: vision_vit_middle
  version: null
  default_hp_metric: false
