# @package _global_
# Migrated to inherit lineage/fusion.yaml (framework defaults).
# Business params preserved verbatim; resolved config identical to pre-migration.
# F-RN18+S: ResNet18 + EMGFormer-S fusion, 8ch target_hand, center-supervised.
# EMG init from incre cotrain S checkpoint (val_mae≈0.25).
# Vision backbone frozen, EMG branch + fusion head trainable.
#
# Usage:
#   python -m egoemg.train experiment=fusion/fusion_rn18_s_center_8ch \
#     trainer.devices=[2,3,4,5] trainer.max_epochs=150
defaults:
  - /lineage/fusion
  - /module: mid_fusion
  - override /transforms: emgformer_regression_aug_extended
  - override /module/featurizer: tds_slim_16ch
  - _self_

# ── Data paths ───────────────────────────────────────────────────────────────
egoemg_unified_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_unified_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false
egoemg_emg_field_preference: filtered_paper

# ── Vision (ResNet18, pre-crops) ─────────────────────────────────────────────
per_episode_crops_dir: data/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false
center_target_only: true

# ── Checkpoints ──────────────────────────────────────────────────────────────
vision_vit_checkpoint: ${oc.env:EMG2POSE_ROOT,.}/logs/fusion/vision_vit_small/version_0/checkpoints/last.ckpt
pretrained_emg_checkpoint: ${oc.env:EMG2POSE_ROOT,.}/test_results/egoemg_emgformer_small_incre_cotrain/checkpoints/best.ckpt
checkpoint:

# ── Not used (config compatibility) ──────────────────────────────────────────
wilor_checkpoint_path: ${oc.env:WILOR_PATH,../WiLoR}/pretrained_models/wilor_final.ckpt
mano_model_path: ${oc.env:WILOR_PATH,../WiLoR}/mano_data

# ── Training ─────────────────────────────────────────────────────────────────
seed: 42
train: true
eval: true
batch_size: 200
val_batch_size: 100
num_workers: 10

trainer:
  devices: [2, 3, 4, 5]
  max_epochs: 150
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-4
  weight_decay: 1.0e-4

datamodule:
  window_length: 12_000
  val_test_window_length: 12_000
  stride: 1_200
  val_test_stride: 12_000
  dataset_repeat: 1
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats_repro_filtered_paper_alias.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  delta_reg: 0.0

# ── Module ───────────────────────────────────────────────────────────────────
module:
  vision_backbone_type: vit_small
  vision_embed_dim: 384
  vision_pretrained_checkpoint: ${vision_vit_checkpoint}
  skip_vision_backbone: false
  fusion_mode: center_supervised
  moddrop_prob: 0.0
  force_zero_emg: false
  out_channels: 22
  provide_initial_pos: false
  emg_feat_dim: 256
  fusion_proj_dim: 256
  decoder:
    causal: false
    pos_encoding: rope
    in_channels: 256
    model_dim: 256
    num_heads: 4
    num_layers: 3
    ffn_dim: 512
    dropout: 0.1
  head:
    in_channels: 256
    out_channels: 22

component_lr_scales:
  featurizer: 1.0
  decoder: 1.0
  vision_backbone: 1.0
  vision_proj: 1.0
  fusion_proj: 1.0
  head: 1.0
  head_vision: 1.0


callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_mae
    mode: min
    save_top_k: 3
    save_last: true
    filename: "vits-s-8ch-centerfusion-{epoch:03d}-{val_mae:.4f}"
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: logs/fusion
  name: fusion_vits_s_8ch
  version: null
  default_hp_metric: false

center_frame_eval: true
