# @package _global_
defaults:
  - /module: emgconformer_original
  - override /lr_scheduler: cosine
  - override /transforms: emgconformer_basic
  - _self_

# Hyperparameters
optimizer:
  lr: .0005
checkpoint: /home/xiziheng/develop/emg2pose/logs/2026-01-01/22-56-47/lightning_logs/version_0/checkpoints/best-monitor_metric=0.0000.ckpt

datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 6_000
  val_test_window_length: 6_000
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0,1,2]
  precision: bf16-mixed
  max_epochs: 300
  check_val_every_n_epoch: 1

batch_size: 1500
num_workers: 12
matmul_precision: high
