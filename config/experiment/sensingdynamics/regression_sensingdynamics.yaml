# @package _global_
defaults:
  - /module: sensingdynamics
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_best
  - _self_

num_workers: 12

optimizer:
  lr: 0.0001

datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

dataset:
  train:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: False
      allowed_splits: [train]
  val:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [val]
  test:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: False
      allowed_splits: [test]

trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: 16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 1

batch_size: 256
matmul_precision: high
