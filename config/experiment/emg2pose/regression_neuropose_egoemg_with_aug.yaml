# @package _global_
# Migrated to inherit lineage/classic.yaml (framework defaults).
# Business params preserved verbatim; resolved config identical to pre-migration.
# NeuroPose baseline (original architecture) trained on EgoEMG from scratch.
# Faithfully reproduces the original experiment config from upstream commit 8f9a15e.
# No EMG normalization, only rotation augmentation — identical to original.
#
# Key changes for EgoEMG:
#   - dataset → EgoEMG memmap (both hands)
#   - out_channels: 20→22
#
# Usage:
#   python -m emg2pose.train experiment=emg2pose/regression_neuropose_egoemg

defaults:
  - /lineage/classic
  - /module: pose
  - override /transforms: emgformer_regression_aug_best
  - _self_

egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices: [10, 12, 0, 1, 2, 4, 5, 6]
egoemg_channel_interpolate: false

checkpoint: null
pretrained_strict: false

module:
  provide_initial_pos: False
  predict_vel: False
  featurizer:
    _target_: emg2pose.models.featurizers.neuropose.NeuroPose
    linear_in_channels: 32
    out_channels: 22
    encoder_blocks:
      - _target_: emg2pose.models.featurizers.neuropose.EncoderBlock
        in_channels: 1
        out_channels: 32
        kernel_size: [3, 2]
        max_pool_size: [10, 2]
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.EncoderBlock
        in_channels: 32
        out_channels: 128
        kernel_size: [3, 2]
        max_pool_size: [8, 2]
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.EncoderBlock
        in_channels: 128
        out_channels: 256
        kernel_size: [3, 2]
        max_pool_size: [4, 4]
        dropout_rate: 0.05
    residual_blocks:
      - _target_: emg2pose.models.featurizers.neuropose.ResidualBlock
        in_channels: 256
        out_channels: 256
        kernel_size: [3, 2]
        num_convs: 3
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.ResidualBlock
        in_channels: 256
        out_channels: 256
        kernel_size: [3, 2]
        num_convs: 3
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.ResidualBlock
        in_channels: 256
        out_channels: 256
        kernel_size: [3, 2]
        num_convs: 3
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.ResidualBlock
        in_channels: 256
        out_channels: 256
        kernel_size: [3, 2]
        num_convs: 3
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.ResidualBlock
        in_channels: 256
        out_channels: 256
        kernel_size: [3, 2]
        num_convs: 3
        dropout_rate: 0.05
    decoder_blocks:
      - _target_: emg2pose.models.featurizers.neuropose.DecoderBlock
        in_channels: 256
        out_channels: 128
        kernel_size: [3, 2]
        upsampling: [10, 4]
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.DecoderBlock
        in_channels: 128
        out_channels: 32
        kernel_size: [3, 2]
        upsampling: [8, 4]
        dropout_rate: 0.05
      - _target_: emg2pose.models.featurizers.neuropose.DecoderBlock
        in_channels: 32
        out_channels: 1
        kernel_size: [3, 2]
        upsampling: [4, 2]
        dropout_rate: 0.05


loss_weights:
  mae: 1
  fingertip_distance: 0.01

optimizer:
  lr: .001

dataset:
  train:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: per-dataset
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.window_length}
      stride: ${datamodule.stride}
      allowed_splits: [train]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      emg_field_preference: filtered
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: per-dataset
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

  val:
    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [val]
      modalities: [emg, joint_angles, labels]
      target_hand: left
      emg_field_preference: filtered
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: per-dataset
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

    - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
      memmap_dir: ${egoemg_memmap_dir}
      window_length: ${datamodule.val_test_window_length}
      stride: ${datamodule.val_test_stride}
      allowed_splits: [val]
      modalities: [emg, joint_angles, labels]
      target_hand: right
      emg_field_preference: filtered
      emg_layout: ${egoemg_emg_layout}
      emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
      channel_interpolate: ${egoemg_channel_interpolate}
      norm_mode: per-dataset
      norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
      dataset_name: egoemg

  test: []

num_workers: 12

datamodule:
  window_length: 7790
  val_test_window_length: 7790
  stride: 780
  val_test_stride: 7_790
  padding: [0, 0]
  norm_mode: per-dataset
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  skip_ik_failures: false
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false

trainer:
  gradient_clip_val: 0
  devices: [0,1,2,3,4,5]
  precision: 16-mixed
batch_size: 256

callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_last: true
    verbose: true
    filename: "neuropose-egoemg-{epoch:03d}-{val_loss:.4f}"
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 50
    check_on_train_epoch_end: false
    verbose: true

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_neuropose_egoemg
  version: null
  default_hp_metric: false

monitor_metric: val_loss
monitor_mode: min