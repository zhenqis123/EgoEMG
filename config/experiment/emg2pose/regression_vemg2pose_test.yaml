# @package _global_
# Note: not migrated to lineage/emg2pose — test variant using emg2pose_v3
# dataset; stays self-contained.

defaults:
  - /module: vemg_with_initial_state
  - override /lr_scheduler: warmup_cosine
  - _self_

# Algorithm settings
module:
  provide_initial_pos: False
  state_condition: True
  head:
    _target_: egoemg.models.heads.mlp.MLPHead
    in_channels: 20
    out_channels: 20

# Hyperparameters
optimizer:
  lr: .001
datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 11_790
  val_test_window_length: 11_790
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/emg_norm_stats.npz
trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: 32
  max_epochs: 100
batch_size: 480
matmul_precision: high

transforms:
  train:
    - _target_: egoemg.transforms.ExtractField
      field: "emg"
    - _target_: egoemg.transforms.RotationAugmentation
      channel_dim: -1
    - _target_: egoemg.transforms.ToFloatTensor
    - _target_: egoemg.transforms.RandomChannelMask
      mask_prob: 0.5
      min_masked: 0
      max_masked: null
      channel_dim: -1
      mask_value: 0.0
    - _target_: egoemg.transforms.RandomTimeMask
      max_mask_size: 1000
      num_masks: 2
      min_mask_size: 0
      time_dim: 0
      mask_value: 0.0
    - _target_: egoemg.transforms.RandomFrequencyMask
      max_mask_size: 128
      num_masks: 2
      min_mask_size: 16
      time_dim: 0
  val:
    - ${to_tensor}
  test: ${transforms.val}
