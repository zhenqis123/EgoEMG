# @package _global_
# Note: not migrated to lineage/emg2pose — uses emg2pose_v3 dataset
# (not EgoEMG) and vemg_with_initial_state module; stays self-contained.

defaults:
  - /module: vemg_with_initial_state
  - override /lr_scheduler: cosine
  - _self_

data_location: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap

checkpoint: /home/xiziheng/develop/emg2pose/emg2pose_model_checkpoints/regression_vemg2pose.ckpt
pretrained_strict: false

# Algorithm settings
module:
  provide_initial_pos: False
  state_condition: True
  head:
    _target_: torch.nn.Identity

loss_weights:
  mae: 1
  fingertip_distance: 0.01

# Hyperparameters
optimizer:
  lr: .0005
datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: True

dataset:
  train:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: true
      skip_ik_failures: True
      allowed_splits: [train]
  val:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: True
      allowed_splits: [val]
  test:
    - _target_: emg2pose.datasets.emg2pose_dataset.Emg2PoseDataset
      root_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3
      memmap_dir: /home/xiziheng/develop/emg2pose/data/emg_corpus/emg2pose_v3_memmap
      window_length: 7_790
      stride: null
      padding: [0, 0]
      jitter: false
      skip_ik_failures: True
      allowed_splits: [test]

num_workers: 12
trainer:
  gradient_clip_val: 1
  devices: [0]
  precision: 32
  max_epochs: 100
batch_size: 380
matmul_precision: high

transforms:
  train:
    - _target_: emg2pose.transforms.ExtractField
      field: "emg"
    - _target_: emg2pose.transforms.RotationAugmentation
      channel_dim: -1
    - _target_: emg2pose.transforms.ToFloatTensor
    - _target_: emg2pose.transforms.RandomChannelMask
      mask_prob: 0.5
      min_masked: 0
      max_masked: null
      channel_dim: -1
      mask_value: 0.0
    - _target_: emg2pose.transforms.RandomTimeMask
      max_mask_size: 1000
      num_masks: 2
      min_mask_size: 0
      time_dim: 0
      mask_value: 0.0
    - _target_: emg2pose.transforms.RandomFrequencyMask
      max_mask_size: 128
      num_masks: 2
      min_mask_size: 16
      time_dim: 0
  val:
    - ${to_tensor}
  test: ${transforms.val}
