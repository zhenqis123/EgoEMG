# @package _global_
defaults:
  - /module: emgformer
  - override /module/decoder: identity
  - override /lr_scheduler: cosine
  - override /transforms: emgformer_regression_aug_ori
  - _self_

# Algorithm settings
module:
  provide_initial_pos: False
  head:
    in_channels: 64

num_workers: 12

# Hyperparameters
optimizer:
  lr: .001

datamodule:
  # Adding 1790 samples, which is the left_context of the tds network
  window_length: 7_790
  val_test_window_length: 7_790
  max_open_files: 4
  norm_mode: batch
  norm_stats_path: /home/xiziheng/develop/emg2pose/assets/emg_norm_stats.npz
  skip_ik_failures: False

trainer:
  gradient_clip_val: 1
  devices: [0,1,2]
  precision: bf16-mixed
  max_epochs: 300
  check_val_every_n_epoch: 2

batch_size: 830
matmul_precision: high
