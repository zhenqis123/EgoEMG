# @package _global_
# L1 lineage: Classic baselines (emg2pose / neuropose / vemg2pose original architectures)
#
# Encapsulates shared framework defaults for config/experiment/emg2pose/*
# experiments that reproduce upstream EMG2Pose / NeuroPose / VEMG2Pose on EgoEMG.
# These use pose / pose_stateful modules which expect an inlined `network:` block
# in the experiment (the featurizer definition); this lineage does NOT touch it.
#
# Uniform across classic experiments (verified):
#   matmul_precision=high, ignore_head_tail_dims=0, persistent_workers=True,
#   prefetch_factor=2, pin_memory=False, skip_ik_failures=False, stride=780,
#   val_test_stride=7790, max_epochs=100, log_every_n_steps=50,
#   loss_weights.{mae=1, fingertip_distance=0.01}.
defaults:
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /transforms: rotation_augmentation
  - override /lr_scheduler: cosine
  - _self_
  # module provided by each experiment (pose / pose_stateful), since each
  # classic baseline inlines its own `network:` architecture block.

# Lineage identifier.
lineage: classic

# ── Shared data paths (EgoEMG memmap) ───────────────────────────────────────
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,/home/xiziheng/develop/emg2pose}/data/EgoEMG_memmap

# ── Uniform datamodule defaults ─────────────────────────────────────────────
datamodule:
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 780
  val_test_stride: 7_790
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false
  skip_ik_failures: false
  # norm_mode, per_dataset_norm_stats_path, dataset_repeat: NOT pinned (vary).

# ── Uniform training-framework defaults ─────────────────────────────────────
matmul_precision: high
ignore_head_tail_dims: 0

trainer:
  gradient_clip_val: 1
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  # precision NOT pinned (bf16-mixed / 16-mixed / 32 all appear).
  # devices NOT pinned.

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
