# @package _global_
# L1 lineage: Classic baselines (emg2pose / neuropose / vemg2pose original architectures)
#
# Encapsulates shared framework defaults for config/experiment/emg2pose/*
# experiments that reproduce upstream EMG2Pose / NeuroPose / VEMG2Pose on EgoEMG.
# These use pose / pose_stateful modules with an inlined `network:` block in the
# experiment (the featurizer definition); this lineage does NOT touch it.
#
# Uniform across classic experiments (verified):
#   matmul_precision=high, ignore_head_tail_dims=0, max_epochs=100,
#   log_every_n_steps=50, check_val_every_n_epoch=1.
defaults:
  - /lineage/_base
  - override /dataset: egoemg_unified_angle_regression
  - override /datamodule: default
  - override /transforms: rotation_augmentation
  - override /lr_scheduler: cosine
  - _self_
  # module provided by each experiment (pose / pose_stateful), since each
  # classic baseline inlines its own `network:` architecture block.

# Lineage identifier.
lineage: emg2pose

# ── Shared data path (unified EgoEMG memmap). Experiments may override.
egoemg_unified_memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/EgoEMG_full_memmap

# ── Uniform training-framework defaults ─────────────────────────────────────

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  # precision, gradient_clip_val, devices: NOT pinned (dispersed).

# datamodule.{wl,stride,...}, optimizer, loss_weights: NOT pinned (vary across
# classic baselines; experiments carry their own).
