# @package _global_
# Shared EMG2Pose settings: stride 390, FK 0.01, matched optimizer-step budget.
defaults:
- /lineage/emgformer
- override /module/featurizer: tds_slim_16ch
- override /module/decoder: transformer/preset/large_aggressive
- override /transforms: emgformer_regression_aug_extended
- _self_
emg2pose_memmap_dir: ${oc.env:EGOEMG_ROOT,.}/data/emg_corpus/emg2pose_v3_memmap
data_location: ${emg2pose_memmap_dir}
self_contained_checkpoint: true
train: true
eval: false
checkpoint: null
resume_ckpt: null
pretrained_checkpoint: null
seed: 42
per_user: true
enable_fingertip_loss: true
batch_augmentation:
  random_gain:
    min_gain: 0.5291
    max_gain: 0.6739
    mask_prob: 0.1422
  mag_warping:
    sigma: 0.177
    num_knots: 15
    mask_prob: 0.0
  baseline_drift:
    mask_prob: 0.3544
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0154
    max_amp_ratio: 0.0572
  powerline_noise:
    mask_prob: 0.08
    min_amp_ratio: 0.0141
    max_amp_ratio: 0.0628
    max_harmonic: 5
  channel_mask:
    mask_prob: 0.0
  time_mask:
    num_masks: 6
    max_mask_size: 500
  freq_mask:
    num_masks: 4
    max_mask_size: 128
  gaussian_noise:
    min_snr_db: 44.0937
    max_snr_db: 50.0
    apply_prob: 0.7761
batch_size: 250
num_workers: 4
module:
  out_channels: 20
  head:
    out_channels: 20
  model_causal: false
  center_supervised: false
  supervise_at_prediction_rate: false
  provide_initial_pos: false
  featurizer:
    se:
      mode: global
  decoder:
    causal: false
    dropout: 0.15
datamodule:
  window_length: 7790
  val_test_window_length: 7790
  stride: 390
  val_test_stride: 7790
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${emg2pose_memmap_dir}/per_dataset_norm_stats.json
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  eval_num_workers: 4
  eval_multiprocessing_context: spawn
  cuda_prefetch: true
dataset:
  train:
  - _target_: egoemg.datasets.corpora.emg2pose.Emg2PoseDataset
    memmap_dir: ${emg2pose_memmap_dir}
    window_length: ${datamodule.window_length}
    stride: ${datamodule.stride}
    padding:
    - 0
    - 0
    jitter: true
    skip_ik_failures: false
    allowed_splits:
    - train
    skip_fields:
    - time
  val:
  - _target_: egoemg.datasets.corpora.emg2pose.Emg2PoseDataset
    memmap_dir: ${emg2pose_memmap_dir}
    window_length: ${datamodule.val_test_window_length}
    stride: ${datamodule.val_test_stride}
    padding:
    - 0
    - 0
    jitter: false
    skip_ik_failures: true
    allowed_splits:
    - val
    skip_fields:
    - time
  test:
  - _target_: egoemg.datasets.corpora.emg2pose.Emg2PoseDataset
    memmap_dir: ${emg2pose_memmap_dir}
    window_length: ${datamodule.val_test_window_length}
    stride: ${datamodule.val_test_stride}
    padding:
    - 0
    - 0
    jitter: false
    skip_ik_failures: true
    allowed_splits:
    - test
    skip_fields:
    - time
optimizer:
  lr: 0.0005
  weight_decay: 0.01
lr_scheduler:
  monitor: ${monitor_metric}
  scheduler:
    _target_: egoemg.training.schedulers.WarmupCosineLR
    warmup_epochs: 0
    start_factor: 1.0
    T_max: 150
    eta_min: 5.0e-05
    steps_per_period: 224
  interval: step
  frequency: 1
trainer:
  devices:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  strategy: ddp
  max_epochs: -1
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  accumulate_grad_batches: 2
  precision: bf16-mixed
  gradient_clip_val: 1
  min_epochs: 0
  max_steps: 33600
  val_check_interval: 448
  benchmark: true
  enable_progress_bar: false
callbacks:
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: ${monitor_metric}
  mode: min
  save_top_k: 1
  save_last: true
  save_on_train_epoch_end: false
  every_n_epochs: 1
  filename: emgformer-{step:06d}-{val_user_macro_mae:.6f}
logger:
  save_dir: ${hydra:runtime.output_dir}
  name: ''
  version: ''
validation_user_macro: true
monitor_metric: val_user_macro_mae
monitor_mode: min
train_monitor_interval: 20
loss_weights:
  mae: 1.0
  landmark/fingertip: 0.01
