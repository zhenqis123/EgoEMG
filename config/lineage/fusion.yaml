# @package _global_
# L1 lineage: Fusion / Vision main line (vision → pose, EMG+vision fusion)
#
# Encapsulates ONLY framework-level defaults uniformly shared across
# config/experiment/fusion/* (32 experiments). Fusion is heterogeneous (mix of
# vision-only baselines and EMG+vision fusion), so dispersed params are NOT
# pinned here — each experiment keeps its own module / transforms / optimizer /
# window_length / stride / lr / dataset_repeat / max_epochs.
#
# Uniform across all 32 fusion experiments (verified):
#   norm_mode=per-dataset, persistent_workers=True, prefetch_factor=2,
#   skip_ik_failures=False, precision=bf16-mixed, gradient_clip_val=1,
#   matmul_precision=high, ignore_head_tail_dims=0,
#   loss_weights.{mae=1.0, fingertip_distance=0.01}.
defaults:
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /lr_scheduler: cosine
  - _self_
  # module NOT pinned — each experiment selects mid_fusion / resnet_vision /
  # vit_vision / wilor_vit. transforms NOT pinned (vision-only uses noop,
  # emg fusion uses emgformer_regression_aug_*).

# Lineage identifier.
lineage: fusion

# ── Shared data paths (EgoEMG memmap + vision pre-crops) ────────────────────
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,/home/xiziheng/develop/emg2pose}/data/EgoEMG_memmap
egoemg_emg_layout: target_hand
egoemg_emg2pose_channel_indices: null
egoemg_channel_interpolate: false
egoemg_emg_field_preference: filtered_paper

# Vision (pre-cropped per-episode LMDB, all-intra videos). Shared by all fusion
# experiments that load vision frames.
per_episode_crops_dir: /mnt/nvme/xiziheng/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false
center_target_only: true

# WiLoR / MANO paths (used by wilor_vit module + fusion compatibility fields).
wilor_checkpoint_path: /home/xiziheng/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/WiLoR/mano_data

# ── Uniform datamodule framework defaults (dispersed wl/stride/repeat/norm_stats
#    stay on each experiment) ─────────────────────────────────────────────────
datamodule:
  norm_mode: per-dataset
  persistent_workers: true
  prefetch_factor: 2
  skip_ik_failures: false

# ── Uniform training-framework defaults ──────────────────────────────────────
matmul_precision: high
ignore_head_tail_dims: 0

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  # max_epochs, check_val_every_n_epoch, log_every_n_steps, devices: NOT pinned.

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
  # delta_reg NOT pinned (some experiments set 0.0 explicitly, others omit).
