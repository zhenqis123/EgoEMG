# @package _global_
# L1 lineage: Fusion / Vision main line (vision → pose, EMG+vision fusion)
#
# Encapsulates ONLY the framework-level defaults uniformly shared across
# config/experiment/fusion/* (32 experiments). Fusion is heterogeneous (4 module
# families: mid_fusion / resnet_vision / vit_vision / wilor_vit), so dispersed
# params are NOT pinned — each experiment keeps its own module / transforms /
# optimizer / window_length / stride / lr / dataset_repeat / loss_weights.
#
# Uniform across all 32 fusion experiments (verified):
#   precision=bf16-mixed, gradient_clip_val=1, matmul_precision=high,
#   ignore_head_tail_dims=0.
defaults:
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /lr_scheduler: cosine
  - _self_
  # module NOT pinned (mid_fusion / resnet_vision / vit_vision / wilor_vit).
  # transforms NOT pinned (noop for vision-only, emgformer_regression_aug_* for fusion).

# Lineage identifier.
lineage: fusion

# ── Shared data paths (EgoEMG memmap + vision pre-crops). Experiments may override.
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,/home/xiziheng/develop/emg2pose}/data/EgoEMG_memmap

# Vision (pre-cropped per-episode LMDB). Shared by fusion experiments that load
# vision frames; vision-only experiments inherit these too.
per_episode_crops_dir: /mnt/nvme/xiziheng/EgoEMG_v2_crops
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
skip_emg_loading: false
center_target_only: true

# WiLoR / MANO paths (used by wilor_vit module + fusion compatibility fields).
wilor_checkpoint_path: /home/xiziheng/WiLoR/pretrained_models/wilor_final.ckpt
mano_model_path: /home/xiziheng/WiLoR/mano_data

# ── Uniform training-framework defaults ──────────────────────────────────────
matmul_precision: high
ignore_head_tail_dims: 0

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  # max_epochs, check_val_every_n_epoch, log_every_n_steps, devices: NOT pinned.

# loss_weights / datamodule.{norm_mode,stride,wl,...} / optimizer intentionally
# NOT overridden — each experiment carries its own (fusion is heterogeneous).
