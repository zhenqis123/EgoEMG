# @package _global_
# L1 lineage: Fusion / Vision main line (vision → pose, EMG+vision fusion)
#
# Encapsulates ONLY the framework-level defaults uniformly shared across
# config/experiment/fusion/* (32 experiments). Fusion is heterogeneous (4 module
# families: mid_fusion / resnet_vision / vit_vision / wilor_vit, plus two fusion
# modes: vision_only vs center_supervised), so dispersed params are NOT pinned.
#
# Uniform across all 32 fusion experiments (verified):
#   precision=bf16-mixed, gradient_clip_val=1, matmul_precision=high,
#   ignore_head_tail_dims=0.
#
# NOT pinned (vary between vision-only baselines and EMG fusion experiments):
#   module, transforms, datamodule.{wl,stride,repeat,norm_stats}, optimizer,
#   loss_weights, center_target_only, skip_emg_loading, vision_num_frames,
#   per_episode_crops_dir, max_epochs, devices.
defaults:
  - /lineage/_base
  - override /dataset: egoemg_angle_regression
  - override /datamodule: default
  - override /lr_scheduler: cosine
  - _self_
  # module NOT pinned. transforms NOT pinned. vision fields NOT pinned.

# Lineage identifier.
lineage: fusion

# ── Shared data path (EgoEMG memmap). Experiments may override.

# WiLoR / MANO paths NOT pinned here — only wilor_vit experiments need them,
# and they set their own. Other fusion experiments (resnet/vit/mid_fusion) don't.

# ── Uniform training-framework defaults ──────────────────────────────────────

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  # max_epochs, check_val_every_n_epoch, log_every_n_steps, devices: NOT pinned.
