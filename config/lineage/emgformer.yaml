# @package _global_
# L1 lineage: EMGFormer main line (EMG → pose supervised regression)
#
# Encapsulates ONLY the framework-level defaults uniformly shared across
# config/experiment/emgformer/* experiments. Dispersed business params
# (window_length, stride, lr, max_epochs, etc.) are NOT pinned here — they
# stay on each experiment or on the datamodule preset, so migrating an
# experiment to inherit this lineage never changes its resolved config.
#
# Uniform across all emgformer experiments (verified):
#   precision=bf16-mixed, gradient_clip_val=1, check_val_every_n_epoch=1,
#   matmul_precision=high, persistent_workers=True, prefetch_factor=2,
#   skip_ik_failures=False, loss_weights.{mae,fingertip_distance}.
defaults:
  - /module: emgformer
  - /augmentation: batch_aug
  - override /dataset: egoemg_angle_regression
  - override /datamodule: egoemg
  - override /transforms: emgformer_regression_aug_extended
  - override /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# Lineage identifier (for hydra run.dir namespacing and logging).
lineage: emgformer

# ── Shared data paths (EgoEMG memmap) ────────────────────────────────────────
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,/home/xiziheng/develop/emg2pose}/data/EgoEMG_memmap
egoemg_emg_layout: target_hand
egoemg_emg2pose_channel_indices: null
egoemg_channel_interpolate: false
egoemg_emg_field_preference: filtered_paper

# ── Uniform training-framework defaults ──────────────────────────────────────
matmul_precision: high
ignore_head_tail_dims: 0

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  # max_epochs, log_every_n_steps, devices: NOT pinned (dispersed) — experiment or CLI.

loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
