# @package _global_
# L1 lineage: EMGFormer main line (EMG → pose supervised regression)
#
# Encapsulates ONLY the framework-level defaults uniformly shared across
# config/experiment/emgformer/* experiments. Dispersed business params
# (window_length, stride, lr, max_epochs, field_preference, etc.) are NOT
# pinned here — they stay on each experiment or are inherited from base /
# the datamodule preset. Migrating an experiment to inherit this lineage
# must not change its resolved config.
#
# Uniform across emgformer experiments (verified):
#   precision=bf16-mixed, gradient_clip_val=1, check_val_every_n_epoch=1,
#   matmul_precision=high, ignore_head_tail_dims=0.
defaults:
  - /lineage/_base
  - /module: emgformer
  - /augmentation: batch_aug
  - override /dataset: egoemg_angle_regression
  - override /datamodule: egoemg
  - override /transforms: emgformer_regression_aug_extended
  - override /lr_scheduler: cosine
  - override /module/featurizer: tds_slim
  - _self_

# Lineage identifier (for hydra run.dir namespacing and logging).
lineage: emgformer

# ── Shared data path (EgoEMG memmap). Experiments may override.

# ── Uniform training-framework defaults ──────────────────────────────────────

trainer:
  gradient_clip_val: 1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  # max_epochs, log_every_n_steps, devices: NOT pinned (dispersed).

# loss_weights intentionally NOT overridden — base.yaml provides the default
# {mae: 1, landmark/fingertip: 0.01} shared by emgformer experiments.
