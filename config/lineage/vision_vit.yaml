# @package _global_
# Shared model/training settings. Session recipes select data explicitly.
defaults:
- /lineage/fusion
- /module: vit_vision
- override /transforms: noop
- _self_
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices:
- 10
- 12
- 0
- 1
- 2
- 4
- 5
- 6
egoemg_channel_interpolate: false
skip_emg_loading: true
vision_num_frames: 1
vision_frame_selection: center
vision_patch_size: 256
hydra:
  run:
    dir: logs/fusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  output_subdir: hydra_configs
  job:
    name: vision_vit_small
    chdir: false
seed: 42
train: true
eval: true
component_lr_scales:
  backbone: 1.0
  head: 1.0
batch_size: 360
val_batch_size: 256
num_workers: 10
trainer:
  devices:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  max_epochs: 200
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-05
  weight_decay: 0.01
lr_scheduler:
  scheduler:
    eta_min: 5.0e-06
datamodule:
  window_length: 7790
  val_test_window_length: 7790
  stride: 780
  val_test_stride: 7790
  dataset_repeat: 2
  norm_mode: per-dataset
  per_dataset_norm_stats_path: ${oc.env:EGOEMG_ROOT,.}/data/emg_corpus/emg2pose_v3_memmap/per_dataset_norm_stats.json
  skip_ik_failures: false
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false
loss_weights:
  mae: 1.0
  fingertip_distance: 0.01
module:
  _target_: egoemg.models.modules.vit_vision.VisionViTPose
  backbone_type: vit_small
  out_channels: 22
  pretrained: true
  freeze_backbone: false
  head_hidden: 512
  head_dropout: 0.1
callbacks:
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val_mae
  mode: min
  save_top_k: 3
  save_last: true
  filename: vit-small-{epoch:03d}-{val_mae:.4f}
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
- _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val_mae
  mode: min
  patience: 30
  check_on_train_epoch_end: false
logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: ${hydra:runtime.output_dir}
  name: ""
  version: ""
  default_hp_metric: false
center_frame_eval: true
