# @package _global_
# EgoEMG datamodule preset — shared by regression_egoemg, finetune_egoemg, etc.
datamodule:
  _target_: egoemg.datamodule.WindowedEmgDataModule
  dataset_conf: ${dataset}
  window_length: 7_790
  val_test_window_length: 7_790
  stride: 780
  val_test_stride: 7_790
  padding: [0, 0]
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  skip_ik_failures: false
  max_open_files: 32
  norm_mode: per-dataset
  norm_stats_path: null
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats.json
  norm_eps: 1e-6
