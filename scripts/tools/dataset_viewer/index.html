<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dataset viewer</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><div class="brand"><span class="brand-icon">◫</span><div>Dataset viewer<small>Synchronized multimodal inspection</small></div></div><div class="session-tools"><label class="search"><span>⌕</span><input id="search" aria-label="Search sessions" placeholder="Search dates, participants, sessions…"></label></div><nav id="sessionList" aria-label="Session list"><div class="empty">Loading sessions…</div></nav><footer id="libraryCount">Dataset library</footer></aside>
<div class="shell"><header class="topbar"><div><div class="eyebrow" id="source">SESSION</div><h1 id="sessionTitle">Loading data…</h1><div class="subtitle" id="sessionMeta"></div></div><button class="quiet" id="details">Session details</button></header><div class="workspace-toolbar"><div class="presets"><span class="toolbar-label">View presets</span><button data-preset="default" class="preset active">Head camera + MANO</button><button data-preset="crop" class="preset">Video + hand crop</button><button data-preset="emg" class="preset">Video + EMG</button><button data-preset="wrist" class="preset">Video + wrist angles</button><button data-preset="compare" class="preset">Compare cameras</button></div><button class="primary" id="addView">＋ Add view</button></div><main id="workspace" aria-label="Visualization workspace"></main><div id="notice" role="status"></div><footer class="transport"><div class="transport-actions"><button id="back" title="Back 1 second" aria-label="Back 1 second">−1s</button><button class="play" id="play" aria-label="Play">▶</button><button id="forward" title="Forward 1 second" aria-label="Forward 1 second">+1s</button><select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><div class="timeline"><div class="time-label"><span id="clock">00:00 / 00:00</span><span id="phaseSummary"></span></div><input id="seek" type="range" aria-label="Timeline" min="0" step="0.01" value="0"></div><label class="time-entry"><input id="time" aria-label="Seek to seconds" type="number" min="0" step="0.1" value="0"><span>s</span></label></footer></div>
<dialog id="viewDialog"><div class="dialog-heading"><div><h2>Add view</h2><p>Select a modality. Multiple panels can be added.</p></div><button class="icon close-dialog" aria-label="Close">×</button></div><div id="viewChoices" class="view-choices"></div></dialog>
<dialog id="infoDialog"><div class="dialog-heading"><div><h2>Session details</h2><p>Calibration, timing, and missing data</p></div><button class="icon close-dialog" aria-label="Close">×</button></div><pre id="metadataText"></pre></dialog><script src="/app.js" defer></script></body></html>
