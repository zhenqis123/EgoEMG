<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">EgoEMG Dataset at a glance</title>
  <desc id="description">Dataset statistics: 53 participants, over 18 hours of synchronized recordings, 60 gesture classes, 2 kilohertz bilateral wristband EMG, 120 hertz IMU on each wrist, and five sensing modalities.</desc>

  <!-- paper card with ink border -->
  <rect x="3" y="3" width="1194" height="674" rx="18" fill="#fbf9f4" stroke="#191c20" stroke-width="4"/>

  <!-- header: mark + wordmark + trace -->
  <g transform="translate(36,32)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#191c20" stroke-width="3"/>
    <polyline points="8,32 12,32 14,26 16,36 18,29 20,32 24,32" fill="none" stroke="#1971c2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="26,32 30,32 32,36 34,25 36,31 38,29 42,29" fill="none" stroke="#e8590c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="25" y1="29" x2="25" y2="10" stroke="#191c20" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="30" r="3" fill="#e8590c"/>

    <text x="58" y="28" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#191c20">EgoEMG</text>
    <text x="58" y="44" font-family="'Courier New', monospace" font-size="13" fill="#7a828b" letter-spacing="1.5">DATASET AT A GLANCE</text>
  </g>

  <!-- 2×3 stat cards; card 340×248, gap 32; col x: 36, 408, 780; row y: 96, 372 -->
  <!-- fonts: numeral 54px, label 22px, detail 15px -->

  <!-- Row 1: 53 / 18+h / 60 -->
  <g>
    <rect x="36" y="96" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="36" y="96" width="340" height="7" rx="3.5" fill="#191c20"/>
    <text x="206" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">53</text>
    <text x="206" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">participants</text>
    <text x="206" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">106 hands · left &amp; right labelled</text>
  </g>

  <g>
    <rect x="408" y="96" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="408" y="96" width="340" height="7" rx="3.5" fill="#e8590c"/>
    <text x="578" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">18+ h</text>
    <text x="578" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">synchronized recordings</text>
    <text x="578" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">132M aligned frames @ 2 kHz</text>
  </g>

  <g>
    <rect x="780" y="96" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="780" y="96" width="340" height="7" rx="3.5" fill="#1971c2"/>
    <text x="950" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">60</text>
    <text x="950" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">gesture classes</text>
    <text x="950" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">30 unimanual · 30 bimanual</text>
  </g>

  <!-- Row 2: 2kHz / 120Hz / 5 -->
  <g>
    <rect x="36" y="372" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="36" y="372" width="340" height="7" rx="3.5" fill="#e8590c"/>
    <polyline points="60,570 85,570 91,562 97,578 103,566 109,570 130,570" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="140,570 165,570 171,578 177,562 183,572 189,568 210,568" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="240" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">2 kHz</text>
    <text x="240" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">bilateral EMG</text>
    <text x="240" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">8 channels per wrist</text>
  </g>

  <g>
    <rect x="408" y="372" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="408" y="372" width="340" height="7" rx="3.5" fill="#191c20"/>
    <line x1="435" y1="540" x2="475" y2="540" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/>
    <line x1="435" y1="552" x2="460" y2="552" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
    <line x1="435" y1="564" x2="420" y2="564" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/>
    <text x="612" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">120 Hz</text>
    <text x="612" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">IMU on each wrist</text>
    <text x="612" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">triaxial accel + gyro</text>
  </g>

  <g>
    <rect x="780" y="372" width="340" height="248" rx="14" fill="#fff" stroke="#191c20" stroke-width="1.5"/>
    <rect x="780" y="372" width="340" height="7" rx="3.5" fill="#e8590c"/>
    <text x="950" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="600" fill="#191c20">5</text>
    <text x="950" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#454c54">sensing modalities</text>
    <text x="950" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">sEMG · IMU · RGB · RGB-D</text>
    <text x="950" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7a828b">mocap joint angles</text>
  </g>
</svg>
