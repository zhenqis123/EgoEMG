<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">EgoEMG Dataset at a glance</title>
  <desc id="description">Dataset statistics: 53 participants, over 18 hours of synchronized recordings, 60 gesture classes, 2 kilohertz bilateral wristband EMG, 120 hertz IMU on each wrist, and five sensing modalities.</desc>

  <!-- paper card -->
  <rect x="2" y="2" width="1196" height="436" rx="14" fill="#fbf9f4" stroke="#191c20" stroke-width="3"/>

  <!-- header strip: compact inline -->
  <g transform="translate(18,12)">
    <rect x="0" y="0" width="30" height="30" rx="7" fill="none" stroke="#191c20" stroke-width="2.2"/>
    <polyline points="5,21 8,21 10,17 12,24 14,20 16,21 19,21" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="21,21 24,21 26,24 28,17 30,21 32,20 35,20" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18.5" y1="20" x2="18.5" y2="7" stroke="#191c20" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="18.5" cy="21" r="2.2" fill="#e8590c"/>
    <text x="40" y="15" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#191c20">EgoEMG</text>
    <text x="40" y="27" font-family="'Courier New', monospace" font-size="10" fill="#7a828b" letter-spacing="0.8">DATASET AT A GLANCE</text>
  </g>

  <!-- 3×2 grid: card 376×168, gap 22; col x: 18, 416, 814; row y: 52, 242 -->
  <!-- card layout: icon (16px zone) + numeral on same line, label+detail below -->

  <!-- 1: 53 participants -->
  <g>
    <rect x="18" y="52" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="18" y="52" width="376" height="5" rx="2.5" fill="#191c20"/>
    <!-- icon: person -->
    <circle cx="50" cy="86" r="7" fill="none" stroke="#191c20" stroke-width="2"/>
    <path d="M39,102 Q39,94 50,94 Q61,94 61,102 Z" fill="none" stroke="#191c20" stroke-width="2" stroke-linejoin="round"/>
    <!-- numeral beside icon -->
    <text x="206" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">53</text>
    <text x="206" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">participants</text>
    <text x="206" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">106 hands · L+R labelled</text>
  </g>

  <!-- 2: 18+ h -->
  <g>
    <rect x="416" y="52" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="416" y="52" width="376" height="5" rx="2.5" fill="#e8590c"/>
    <!-- icon: clock -->
    <circle cx="448" cy="90" r="10" fill="none" stroke="#191c20" stroke-width="2"/>
    <line x1="448" y1="90" x2="448" y2="83" stroke="#191c20" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="448" y1="90" x2="454" y2="93" stroke="#191c20" stroke-width="1.8" stroke-linecap="round"/>
    <text x="604" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">18+ h</text>
    <text x="604" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">synchronized recordings</text>
    <text x="604" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">132M frames @ 2 kHz</text>
  </g>

  <!-- 3: 60 gestures -->
  <g>
    <rect x="814" y="52" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="814" y="52" width="376" height="5" rx="2.5" fill="#1971c2"/>
    <!-- icon: hand -->
    <path d="M846,98 L846,88 Q846,84 848.5,84 Q851,84 851,88 L851,80 Q851,76 853.5,76 Q856,76 856,80 L856,77 Q856,73 858.5,73 Q861,73 861,77 L861,80 Q861,77 863.5,77 Q866,77 866,81 L866,98 Q866,105 859,107 L852,107 Q847,107 846,98 Z"
          fill="none" stroke="#191c20" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="1002" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">60</text>
    <text x="1002" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">gesture classes</text>
    <text x="1002" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">30 unimanual · 30 bimanual</text>
  </g>

  <!-- 4: 2 kHz EMG -->
  <g>
    <rect x="18" y="242" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="18" y="242" width="376" height="5" rx="2.5" fill="#e8590c"/>
    <!-- icon: bilateral traces -->
    <polyline points="32,282 42,282 45,275 48,290 51,279 54,282 62,282" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="66,282 76,282 79,290 82,275 85,286 88,282 96,282" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="206" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">2 kHz</text>
    <text x="206" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">bilateral EMG</text>
    <text x="206" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">8 channels per wrist</text>
  </g>

  <!-- 5: 120 Hz IMU -->
  <g>
    <rect x="416" y="242" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="416" y="242" width="376" height="5" rx="2.5" fill="#191c20"/>
    <!-- icon: 3-axis -->
    <line x1="452" y1="292" x2="452" y2="272" stroke="#191c20" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="452" y1="292" x2="470" y2="292" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="452" y1="292" x2="441" y2="303" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="452" cy="292" r="2.5" fill="#191c20"/>
    <text x="604" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">120 Hz</text>
    <text x="604" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">IMU on each wrist</text>
    <text x="604" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">triaxial accel + gyro</text>
  </g>

  <!-- 6: 5 modalities -->
  <g>
    <rect x="814" y="242" width="376" height="168" rx="10" fill="#fff" stroke="#191c20" stroke-width="1.2"/>
    <rect x="814" y="242" width="376" height="5" rx="2.5" fill="#e8590c"/>
    <!-- icon: stacked layers -->
    <ellipse cx="848" cy="268" rx="12" ry="4.5" fill="none" stroke="#191c20" stroke-width="1.8"/>
    <path d="M836,268 L836,282 Q836,286.5 848,286.5 Q860,286.5 860,282 L860,268" fill="none" stroke="#191c20" stroke-width="1.8"/>
    <path d="M836,275 Q836,279.5 848,279.5 Q860,279.5 860,275" fill="none" stroke="#7a828b" stroke-width="1.3"/>
    <text x="1002" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#191c20">5</text>
    <text x="1002" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#454c54">sensing modalities</text>
    <text x="1002" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a828b">sEMG · IMU · RGB · RGB-D · mocap</text>
  </g>
</svg>
