data_location: ${oc.env:EMG2POSE_ROOT,.}/data/emg_corpus/emg2pose_v3
manus_memmap_dir: data/manus_memmap
seed: 42
matmul_precision: high
default_model_summary: true
model_summary_max_depth: 2
batch_size: 260
num_workers: 12
train: true
eval: true
checkpoint: null
pretrained_checkpoint: null
pretrained_strict: false
freeze_backbone: false
stage2_vision_checkpoint: null
component_lr_scales: {}
ignore_head_tail_dims: 0
batch_augmentation:
  random_gain:
    min_gain: 0.1996
    max_gain: 0.9486
    mask_prob: 0.0295
  mag_warping:
    sigma: 0.7302
    num_knots: 15
    mask_prob: 0.0049
  baseline_drift:
    mask_prob: 0.6547
    min_freq: 0.0114
    max_freq: 0.4625
    min_amp_ratio: 0.0
    max_amp_ratio: 0.1534
  powerline_noise:
    mask_prob: 0.2413
    min_amp_ratio: 0.0
    max_amp_ratio: 0.0628
    max_harmonic: 7
  channel_mask:
    mask_prob: 0.0016
  time_mask:
    num_masks: 0
    max_mask_size: 243
    per_channel: true
  freq_mask:
    num_masks: 18
    max_mask_size: 46
  gaussian_noise:
    min_snr_db: 45.9044
    max_snr_db: 50.0
    apply_prob: 0.1126
  channel_rotation:
    mask_prob: 0.0
    max_shift: 2
  mixup:
    mask_prob: 0.2006
    alpha: 0.2921
monitor_metric: val_mae
monitor_mode: min
loss_weights:
  mae: 1.0
  landmark/fingertip: 0.0
  fingertip_distance: 0.01
trainer:
  max_epochs: 150
  devices:
  - 2
  - 3
  - 4
  - 5
  log_every_n_steps: 5
  precision: bf16-mixed
  enable_model_summary: false
  gradient_clip_val: 1
  check_val_every_n_epoch: 1
  strategy: ddp
callbacks:
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val_mae
  mode: min
  save_top_k: 3
  save_last: true
  filename: egoemg-incre-cotrain-wl12000-{epoch:03d}-{val_mae:.4f}
logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: .
  name: regression_egoemg_incre_cotrain_wl12000
  version: null
  default_hp_metric: false
dataset:
  train:
  - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
    memmap_dir: ${egoemg_memmap_dir}
    window_length: ${datamodule.window_length}
    stride: ${datamodule.stride}
    allowed_splits:
    - train
    modalities:
    - emg
    - joint_angles
    - labels
    target_hand: left
    emg_field_preference: ${egoemg_emg_field_preference}
    emg_layout: ${egoemg_emg_layout}
    emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
    channel_interpolate: ${egoemg_channel_interpolate}
    norm_mode: ${datamodule.norm_mode}
    norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
    dataset_name: egoemg
    jitter: true
  - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
    memmap_dir: ${egoemg_memmap_dir}
    window_length: ${datamodule.window_length}
    stride: ${datamodule.stride}
    allowed_splits:
    - train
    modalities:
    - emg
    - joint_angles
    - labels
    target_hand: right
    emg_field_preference: ${egoemg_emg_field_preference}
    emg_layout: ${egoemg_emg_layout}
    emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
    channel_interpolate: ${egoemg_channel_interpolate}
    norm_mode: ${datamodule.norm_mode}
    norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
    dataset_name: egoemg
    jitter: true
  - _target_: emg2pose.datasets.egoemg_incre_dataset.EgoEmgIncreDataset
    memmap_dir: ${egoemg_incre_memmap_dir}
    window_length: ${datamodule.window_length}
    stride: ${datamodule.stride}
    allowed_splits:
    - train
    target_hand: right
    emg_field_preference: filtered_paper
    emg_layout: ${egoemg_emg_layout}
    emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
    channel_interpolate: ${egoemg_channel_interpolate}
    dataset_name: egoemg_incre
    norm_mode: ${datamodule.norm_mode}
    norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
    jitter: true
  val:
  - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
    memmap_dir: ${egoemg_memmap_dir}
    window_length: ${datamodule.val_test_window_length}
    stride: ${datamodule.val_test_stride}
    allowed_splits:
    - user
    - gesture
    - both
    modalities:
    - emg
    - joint_angles
    - labels
    target_hand: left
    emg_field_preference: ${egoemg_emg_field_preference}
    emg_layout: ${egoemg_emg_layout}
    emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
    channel_interpolate: ${egoemg_channel_interpolate}
    norm_mode: ${datamodule.norm_mode}
    norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
    dataset_name: egoemg
  - _target_: emg2pose.datasets.egoemg_memmap_dataset.EgoEmgMemmapDataset
    memmap_dir: ${egoemg_memmap_dir}
    window_length: ${datamodule.val_test_window_length}
    stride: ${datamodule.val_test_stride}
    allowed_splits:
    - user
    - gesture
    - both
    modalities:
    - emg
    - joint_angles
    - labels
    target_hand: right
    emg_field_preference: ${egoemg_emg_field_preference}
    emg_layout: ${egoemg_emg_layout}
    emg2pose_channel_indices: ${egoemg_emg2pose_channel_indices}
    channel_interpolate: ${egoemg_channel_interpolate}
    norm_mode: ${datamodule.norm_mode}
    norm_stats_path: ${datamodule.per_dataset_norm_stats_path}
    dataset_name: egoemg
  test: ${dataset.val}
datamodule:
  _target_: emg2pose.datamodule.WindowedEmgDataModule
  dataset_conf: ${dataset}
  window_length: 12000
  val_test_window_length: 12000
  stride: 1200
  val_test_stride: 12000
  padding:
  - 0
  - 0
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  skip_ik_failures: false
  max_open_files: 32
  norm_mode: per-dataset
  norm_stats_path: null
  per_dataset_norm_stats_path: ${oc.env:EMG2POSE_ROOT,.}/assets/per_dataset_norm_stats_repro_filtered_paper_alias.json
  norm_eps: 1.0e-06
  eval_multiprocessing_context: forkserver
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
lr_scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.max_epochs}
    eta_min: 5.0e-06
  interval: epoch
  frequency: 1
data_split:
  _target_: emg2pose.utils.load_splits
  metadata_file: ${data_location}/metadata.csv
  subsample: 1
to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg
transforms:
  train:
  - _target_: emg2pose.transforms.ExtractField
    field: emg
  - _target_: emg2pose.transforms.RotationAugmentation
    channel_dim: -1
  - _target_: emg2pose.transforms.ToFloatTensor
  val:
  - ${to_tensor}
  test: ${transforms.val}
module:
  featurizer:
    _target_: emg2pose.models.featurizers.tds.TdsNetwork
    se:
      enable: true
      reduction: 4
      residual: true
      mode: global
    conv_blocks:
    - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
      in_channels: 8
      out_channels: 256
      kernel_size: 11
      stride: 5
    - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
      in_channels: 256
      out_channels: 256
      kernel_size: 5
      stride: 2
    tds_stages:
    - _target_: emg2pose.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 9
      in_conv_stride: 5
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 5
    - _target_: emg2pose.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 3
      in_conv_stride: 1
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 3
  decoder:
    _target_: emg2pose.models.decoders.transformer.TransformerDecoder
    in_channels: 256
    model_dim: 256
    num_heads: 8
    num_layers: 6
    ffn_dim: 1024
    dropout: 0.15
    causal: false
    activation: relu
    norm_first: true
    pos_encoding: rope
    out_proj: true
  head:
    _target_: emg2pose.models.heads.mlp.MLPHead
    in_channels: 256
    out_channels: 22
    hidden_sizes:
    - 512
    activation: relu
    dropout: 0.1
  _target_: emg2pose.models.modules.emgformer.Emg2PoseFormer
  out_channels: 22
  provide_initial_pos: false
egoemg_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_memmap
egoemg_incre_memmap_dir: ${oc.env:EMG2POSE_ROOT,.}/data/EgoEMG_incre/data_right_merged
egoemg_emg_field_preference: filtered_paper
egoemg_emg_layout: target_hand
egoemg_channel_interpolate: false
egoemg_emg2pose_channel_indices: null
