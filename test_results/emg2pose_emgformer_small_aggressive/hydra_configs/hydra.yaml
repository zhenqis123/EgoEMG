hydra:
  run:
    dir: /home/xiziheng/develop/emg2pose/test_results/emg2pose_small_aggressive
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}/seed=${seed}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: hydra_configs
  overrides:
    hydra:
    - hydra.run.dir=/home/xiziheng/develop/emg2pose/test_results/emg2pose_small_aggressive
    - hydra.mode=RUN
    task:
    - experiment=emgformer/regression_emgformer_small_aggressive
    - checkpoint=/home/xiziheng/develop/emg2pose/test_results/emg2pose_small_aggressive/checkpoints/best.ckpt
    - +per_user=true
    - datamodule.norm_mode=per-dataset
  job:
    name: emg2pose
    chdir: null
    override_dirname: +per_user=true,checkpoint=/home/xiziheng/develop/emg2pose/test_results/emg2pose_small_aggressive/checkpoints/best.ckpt,datamodule.norm_mode=per-dataset,experiment=emgformer/regression_emgformer_small_aggressive
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - seed
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/xiziheng/develop/emg2pose
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/xiziheng/develop/emg2pose/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/xiziheng/develop/emg2pose/test_results/emg2pose_small_aggressive
    choices:
      experiment: emgformer/regression_emgformer_small_aggressive
      module: emgformer
      module/head: mlp
      module/decoder: transformer/preset/small
      module/featurizer: tds_slim
      transforms: emgformer_regression_aug_best
      data_split: full_split
      lr_scheduler: cosine
      optimizer: adamw
      datamodule: default
      dataset: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
