datamodule:
  _target_: emg2pose.datamodule.WindowedEmgDataModule
  dataset_conf: ${dataset}
  window_length: 7790
  val_test_window_length: 7790
  stride: 780
  val_test_stride: 7790
  padding:
  - 0
  - 0
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  skip_ik_failures: false
  max_open_files: 32
  norm_mode: per-dataset
  norm_stats_path: null
  per_dataset_norm_stats_path: /home/xiziheng/develop/emg2pose/assets/per_dataset_norm_stats.json
  norm_eps: 1.0e-06
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
lr_scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.max_epochs}
    eta_min: 5.0e-05
  interval: epoch
  frequency: 1
data_split:
  _target_: emg2pose.utils.load_splits
  metadata_file: ${data_location}/metadata.csv
  subsample: 1
to_tensor:
  _target_: emg2pose.transforms.ExtractToTensor
  field: emg
transforms:
  train:
  - _target_: emg2pose.transforms.ExtractField
    field: emg
  - _target_: emg2pose.transforms.RotationAugmentation
    channel_dim: -1
  - _target_: emg2pose.transforms.ToFloatTensor
  - _target_: emg2pose.transforms.RandomChannelMask
    mask_prob: 0.25
    min_masked: 0
    max_masked: null
    channel_dim: -1
    mask_value: 0.0
  - _target_: emg2pose.transforms.RandomTimeMask
    max_mask_size: 500
    num_masks: 0
    min_mask_size: 0
    time_dim: 0
    mask_value: 0.0
  - _target_: emg2pose.transforms.RandomFrequencyMask
    max_mask_size: 128
    num_masks: 3
    min_mask_size: 0
    time_dim: 0
  - _target_: emg2pose.transforms.RandomGaussianNoise
    min_snr_db: 25
    max_snr_db: 35
    apply_prob: 0.5
    time_dim: 0
  val:
  - ${to_tensor}
  test: ${transforms.val}
module:
  featurizer:
    _target_: emg2pose.models.featurizers.tds.TdsNetwork
    se:
      enable: true
      reduction: 4
      residual: true
      mode: global
    conv_blocks:
    - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
      in_channels: 16
      out_channels: 256
      kernel_size: 11
      stride: 5
    - _target_: emg2pose.models.featurizers.tds.Conv1dBlock
      in_channels: 256
      out_channels: 256
      kernel_size: 5
      stride: 2
    tds_stages:
    - _target_: emg2pose.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 9
      in_conv_stride: 5
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 5
    - _target_: emg2pose.models.featurizers.tds.TdsStage
      in_channels: 256
      in_conv_kernel_width: 3
      in_conv_stride: 1
      num_blocks: 1
      channels: 8
      feature_width: 32
      kernel_width: 3
  decoder:
    _target_: emg2pose.models.decoders.transformer.TransformerDecoder
    in_channels: 256
    model_dim: 384
    num_heads: 12
    num_layers: 8
    ffn_dim: 1536
    dropout: 0.15
    causal: false
    activation: relu
    norm_first: true
    pos_encoding: rope
    out_proj: true
    preset: large_aggressive
  head:
    _target_: emg2pose.models.heads.mlp.MLPHead
    in_channels: 384
    out_channels: 22
    hidden_sizes:
    - 512
    activation: relu
    dropout: 0.1
  _target_: emg2pose.models.modules.emgformer.Emg2PoseFormer
  out_channels: 22
  provide_initial_pos: false
egoemg_memmap_dir: /home/xiziheng/develop/emg2pose/data/EgoEMG_memmap
egoemg_emg_layout: emg2pose_interpolate16
egoemg_emg2pose_channel_indices_1based:
- 11
- 13
- 1
- 2
- 3
- 5
- 6
- 7
egoemg_channel_interpolate: false
per_group_stats: true
