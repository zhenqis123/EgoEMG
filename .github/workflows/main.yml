name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        # Must match the python pin in environment.yml.
        python-version: '3.11'
        miniconda-version: "latest"
        activate-environment: emg2pose
        environment-file: environment.yml

    - name: Install packages
      run: |
        pip install -e .
        pip install -e egoemg/UmeTrack
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors or undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Report style issues without failing the build (127-col editor width).
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        pytest egoemg/tests -q
