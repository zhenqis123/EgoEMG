name: CI

on:
  push:
  pull_request:

jobs:
  package-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package and test dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,vision,viz]'

    - name: Check source syntax and fatal lint errors
      run: |
        python -m compileall -q egoemg scripts
        # Maintained package code: fatal errors + unused imports/variables.
        flake8 egoemg --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics
        # scripts/ contains research records beyond the public support surface:
        # fatal errors only.
        flake8 scripts --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Validate citation metadata
      run: |
        python - <<'PY'
        from pathlib import Path
        import yaml

        citation = yaml.safe_load(Path("CITATION.cff").read_text())
        assert citation["type"] == "software"
        assert citation["version"] == "0.1.0rc1"
        assert "date-released" not in citation
        PY

    - name: Secret scan (tracked files)
      run: |
        python - <<'PY'
        import re
        import subprocess
        from pathlib import Path

        patterns = re.compile(
            r"(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}"
            r"|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----"
            r"|access_token=[A-Za-z0-9_\-]{20,})"
        )
        files = subprocess.run(
            ["git", "ls-files"], capture_output=True, text=True, check=True
        ).stdout.splitlines()
        hits = []
        for name in files:
            p = Path(name)
            if not p.is_file() or p.stat().st_size > 2_000_000:
                continue
            text = p.read_bytes()
            match = patterns.search(str(text))
            if match:
                hits.append(f"{name}: {match.group(0)[:40]}")
        assert not hits, "potential secrets found:\n" + "\n".join(hits)
        print(f"secret scan clean over {len(files)} tracked files")
        PY

    - name: Build and install wheel
      run: |
        python -m build --wheel --outdir dist
        python -m pip install --force-reinstall --no-deps dist/*.whl
        python -c 'import importlib.resources as r; import egoemg; assert egoemg.__version__ == "0.1.0rc1"; assert r.files("egoemg.UmeTrack").joinpath("dataset/generic_hand_model.json").is_file()'
        python -c 'import egoemg.models, egoemg.models.decoders, egoemg.models.featurizers, egoemg.utils, egoemg.lightning, egoemg.test_analysis'

    - name: Run unit tests
      run: |
        set -o pipefail
        pytest egoemg/tests -q --tb=short 2>&1 | tee /tmp/pytest.log || \
          (tail -n 30 /tmp/pytest.log | sed 's/^/ERROR: /' | while IFS= read -r line; do \
             echo "::error::${line}"; done; exit 1)
